<body>
<canvas id="c"></canvas>
<script src="shared/config.js?v=22"></script>
<script src="shared/common.js?v=22"></script>
<script>
(() => {
  const cv = document.getElementById('c');
  const DURATION = +(BS.params.get('t') || 75), LIVES = 3;
  const INK = '#1d2540', SLATE = '#56648a', TAU = Math.PI * 2;
  const FONT = 'Inter, -apple-system, sans-serif'; // one typeface across the set
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  const HUD_Y = 42, LIFE_R = 10.5, MAX_SHARDS = 150, MAX_PARTS = 150;
  const PRISM = ['#ff5fa2', '#ffb02e', '#1fc8ac', '#4f8dfa', '#9166f5'];
  const SPARK = ['255,110,170', '255,186,72', '40,204,178', '98,150,255', '160,124,250'];
  const BARRIERS = [{ k: 'silo', t: 'SILO' }, { k: 'legacy', t: 'LEGACY' }, { k: 'hidden', t: 'HIDDEN' }, { k: 'scatter', t: 'SCATTERED' }];
  // Each gold seal asks one of the four things trusted context answers (OpenText's definition: where data came
  // from, who owns it, whether it's current and cleared for use). q sits under the seal; ok is the pop when it is
  // approved; lost is what the agent is left with when the seal is cut.
  const CHECKS = [
    { q: 'SOURCE?', ok: 'Source verified', lost: 'Unknown source' },
    { q: 'OWNER?', ok: 'Owner confirmed', lost: 'Unknown owner' },
    { q: 'CURRENT?', ok: 'Up to date', lost: 'Out of date' },
    { q: 'CLEARED?', ok: 'Cleared for use', lost: 'Not cleared' },
  ];
  const CHECK_INK = '#8a5d0c';
  // Each barrier is its own tint of glass.
  const TINT = {
    silo: { rgb: '98,146,250', lite: '216,229,255', deep: '44,74,160', ink: '#2c4a9c' },
    legacy: { rgb: '184,164,146', lite: '240,233,226', deep: '104,84,68', ink: '#6b5442' },
    hidden: { rgb: '152,116,244', lite: '232,223,255', deep: '84,56,170', ink: '#5438a6' },
    scatter: { rgb: '44,190,174', lite: '208,245,238', deep: '16,112,104', ink: '#127268' },
  };
  const DOCS = [
    { t: 'Contract', c: '#7c9cff' }, { t: 'Invoice', c: '#5eead4' }, { t: 'Email thread', c: '#ffb86b' },
    { t: 'Customer record', c: '#ff7eb3' }, { t: 'Case file', c: '#a78bfa' }, { t: 'Supplier notice', c: '#ffd166' },
    { t: 'Order history', c: '#60c5ff' }, { t: 'Policy', c: '#8ee08e' },
  ];
  const BLOBS = [
    { c: '146,176,255', bx: .12, by: .2, r: .64, f: .21, ph: 0 },
    { c: '255,180,210', bx: .92, by: .36, r: .56, f: .17, ph: 2 },
    { c: '162,232,214', bx: .2, by: .82, r: .6, f: .13, ph: 4 },
    { c: '255,220,150', bx: .88, by: .93, r: .5, f: .19, ph: 1 },
    { c: '204,178,255', bx: .56, by: .56, r: .4, f: .11, ph: 3 },
  ];
  const RAYS = [{ x: .0, a: -.46, w: .2, al: .8, ph: 0 }, { x: .34, a: -.4, w: .08, al: .6, ph: 2 }, { x: .58, a: -.5, w: .24, al: .7, ph: 4 }, { x: .95, a: -.44, w: .12, al: .5, ph: 5 }];
  const BOKEH = [
    { x: .16, y: .1, r: .2, f: .09, ph: 0, v: 7, al: .5 }, { x: .82, y: .32, r: .13, f: .12, ph: 1, v: 10, al: .6 },
    { x: .42, y: .52, r: .26, f: .07, ph: 2, v: 5, al: .34 }, { x: .9, y: .7, r: .17, f: .1, ph: 3, v: 8, al: .5 },
    { x: .1, y: .64, r: .1, f: .14, ph: 4, v: 12, al: .65 }, { x: .64, y: .9, r: .15, f: .08, ph: 5, v: 9, al: .5 },
    { x: .3, y: .3, r: .07, f: .16, ph: 6, v: 14, al: .7 },
  ];
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const back = t => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);
  const seeded = seed => () => {
    seed = seed + 0x6D2B79F5 | 0;
    let x = Math.imul(seed ^ seed >>> 15, 1 | seed);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
  // Shake and flashes are toned down when the device asks for reduced motion.
  const rmq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  let RM = !!(rmq && rmq.matches);
  if (rmq && rmq.addEventListener) rmq.addEventListener('change', e => { RM = e.matches; });

  let ctx, W, H, PW, PH, SR, hintY = 0, timerGrad = null, fadeGrad = null;
  let items = [], shards = [], reveals = [], pops = [], parts = [], trail = [], fx = [];
  let running = false, over = false, time = 0, clock = 0, score = 0, lives = LIVES;
  let cleared = 0, approved = 0, breaches = 0, seen = 0, spawnCd = .4, flash = 0, trayPulse = 0, sealHints = 0, bestCombo = 0, warnSec = 0;
  let shake = 0, lifeFx = null, shownScore = 0, scoreT = -9, overAt = 0;
  let ptr = null, checkBag = [], trayW = 136, trayX = 0;

  function resize() {
    ({ ctx, w: W, h: H } = BS.fit(cv));
    PW = clamp(W * .25, 82, 118); PH = PW * 1.28; SR = PW * .37;
    timerGrad = ctx.createLinearGradient(0, 0, W, 0);
    PRISM.forEach((c, i) => timerGrad.addColorStop(i / 4, c));
    fadeGrad = ctx.createLinearGradient(0, 0, 0, 104);
    fadeGrad.addColorStop(0, 'rgba(241,244,253,.8)'); fadeGrad.addColorStop(1, 'rgba(241,244,253,0)');
    // The tray is wide enough for "Your agent can see" on most phones; it sits a touch right of centre then, because
    // the score chip beside it grows with the score and the lives chip does not.
    trayW = clamp(W - 220, 112, 170); trayX = W / 2 + (trayW > 150 ? 4 : 0);
    placeHint();
  }
  // The shell's strip (caption, then hosts · game · attempt) takes the bottom of the screen; the caption wraps to a
  // second line on narrow phones. Keep the opening hint clear above it.
  function placeHint() {
    const r = BS.pill && BS.pill.getBoundingClientRect();
    hintY = Math.min(H - (BS.SAFE_BOTTOM || 64) - 6, r && r.height > 16 ? r.top - 10 : H);
  }

  // ---------- spawning: panes and seals rise like bubbles ----------
  function spawn(p) {
    const seal = Math.random() < .2 + .12 * p;
    const half = seal ? SR : PW / 2;
    let x0 = rand(half + 12, W - half - 12);
    for (let i = 0; i < 6; i++) {
      if (!items.some(o => o.y > H - PH && Math.abs(o.x0 - x0) < PW)) break;
      x0 = rand(half + 12, W - half - 12);
    }
    const it = {
      kind: seal ? 'seal' : 'pane', x0, x: x0, y: H + (seal ? SR : PH / 2) + 8,
      vy: -(rand(112, 150) + 95 * p), swayA: rand(6, 20), swayF: rand(.5, 1.1), ph: rand(0, 6),
      rot: rand(-.12, .12), vr: rand(-.12, .12), age: 0, state: 'live', t: 0,
    };
    if (seal) {
      if (!checkBag.length) checkBag = [0, 1, 2, 3].sort(() => Math.random() - .5); // all four come round before any repeats
      it.chk = checkBag.pop();
      if (sealHints < 2) { it.hint = true; sealHints++; }
    }
    else { it.b = pick(BARRIERS); it.doc = pick(DOCS); }
    items.push(it);
  }

  // ---------- input ----------
  cv.addEventListener('pointerdown', e => {
    if (!running || ptr) return;
    ptr = { id: e.pointerId, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, t: performance.now(), moved: false, hits: 0 };
    trail = [{ x: ptr.x, y: ptr.y, t: clock }];
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  });
  cv.addEventListener('pointermove', e => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
    for (const ev of evs) {
      const qx = ev.clientX, qy = ev.clientY;
      if (!ptr.moved && Math.hypot(qx - ptr.sx, qy - ptr.sy) > 12) { ptr.moved = true; cutSegment(ptr.sx, ptr.sy, qx, qy); }
      else if (ptr.moved) cutSegment(ptr.x, ptr.y, qx, qy);
      if (!ptr) return; // the cut ended the round
      ptr.x = qx; ptr.y = qy;
      trail.push({ x: qx, y: qy, t: clock });
    }
  });
  const release = e => {
    if (!ptr || e.pointerId !== ptr.id) return;
    if (running && !ptr.moved && performance.now() - ptr.t < 400) tap(ptr.sx, ptr.sy);
    if (running && ptr.hits >= 2) combo(ptr.hits, ptr.x, ptr.y);
    ptr = null;
  };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  function inPane(it, x, y) {
    const c = Math.cos(-it.rot), s = Math.sin(-it.rot), dx = x - it.x, dy = y - it.y;
    const lx = dx * c - dy * s, ly = dx * s + dy * c;
    return Math.abs(lx) <= PW / 2 && Math.abs(ly) <= PH / 2;
  }
  function segDist(px, py, ax, ay, bx, by) {
    const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy || 1;
    const t = clamp(((px - ax) * vx + (py - ay) * vy) / l2, 0, 1);
    return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
  }
  function cutSegment(ax, ay, bx, by) {
    const steps = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / 6));
    for (const it of items) {
      if (it.state !== 'live') continue;
      if (it.kind === 'seal') {
        if (segDist(it.x, it.y, ax, ay, bx, by) < SR * .82) breach(it);
        continue;
      }
      for (let i = 0; i <= steps; i++) {
        if (inPane(it, ax + (bx - ax) * i / steps, ay + (by - ay) * i / steps)) { cutPane(it, ax, ay, bx, by); break; }
      }
    }
  }

  // Effects only: capped so a long combo never floods the frame.
  function addPart(q) { parts.push(q); if (parts.length > MAX_PARTS) parts.shift(); }
  function glints(x, y, n, speed, life, size) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(.35, 1) * speed, l = rand(.6, 1) * life;
      addPart({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: l, max: l, size: rand(.6, 1) * size, glint: pick(SPARK) });
    }
  }

  function cutPane(it, ax, ay, bx, by) {
    it.state = 'dead'; cleared++; score += 10;
    if (ptr) { ptr.hits++; bestCombo = Math.max(bestCombo, ptr.hits); }
    shards.push(...makeShards(it, PW, ax, ay, bx, by, Math.random));
    if (shards.length > MAX_SHARDS) shards.splice(0, shards.length - MAX_SHARDS);
    reveals.push({ x: it.x, y: it.y, rot: it.rot, doc: it.doc, t: 0 });
    const cp = cutPoint(it, PW, ax, ay, bx, by);
    fx.push({ type: 'slash', x: cp.x, y: cp.y, ang: Math.atan2(by - ay, bx - ax), len: PW * 2.3, t: 0, dur: .3 });
    glints(cp.x, cp.y, 5, 420, .55, .5);
    pop(it.x, it.y - PH / 2 - 8, '+10', 15, SLATE);
    BS.sfx('cut');
    BS.vibrate(8);
  }
  // Where a swipe a→b crosses a pane: the projection of its centre on the swipe line, kept inside the pane.
  function cutPoint(it, pw, ax, ay, bx, by) {
    const len = Math.hypot(bx - ax, by - ay) || 1, dx = (bx - ax) / len, dy = (by - ay) / len;
    const t = (it.x - ax) * dx + (it.y - ay) * dy;
    let x = ax + dx * t, y = ay + dy * t;
    const off = Math.hypot(x - it.x, y - it.y), lim = pw * .3;
    if (off > lim) { x = it.x + (x - it.x) / off * lim; y = it.y + (y - it.y) / off * lim; }
    return { x, y, dx, dy };
  }
  // Glass shards for a pane of width pw cut along a→b. rnd lets the tutorial use a seeded source.
  function makeShards(it, pw, ax, ay, bx, by, rnd) {
    const R = (a, b) => a + rnd() * (b - a), out = [];
    const { x: cx, y: cy, dx, dy } = cutPoint(it, pw, ax, ay, bx, by);
    // perimeter points (corners + one random point per edge), rotated into world space
    const hw = pw / 2, hh = pw * 1.28 / 2, loc = [];
    const corners = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
    for (let i = 0; i < 4; i++) {
      const a = corners[i], b = corners[(i + 1) % 4], k = R(.3, .7);
      loc.push(a, [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]);
    }
    const c = Math.cos(it.rot), s = Math.sin(it.rot);
    const P = loc.map(([x, y]) => ({ x: it.x + x * c - y * s, y: it.y + x * s + y * c }));
    const piece = (pts, boost) => {
      let gx = 0, gy = 0;
      for (const p of pts) { gx += p.x; gy += p.y; }
      gx /= pts.length; gy /= pts.length;
      const ox = gx - cx, oy = gy - cy, ol = Math.hypot(ox, oy) || 1, sp = R(70, 210) * boost, hue = R(0, 360);
      const tone = SPARK[Math.floor(hue / 72) % 5];
      out.push({
        x: gx, y: gy, pts: pts.map(p => [p.x - gx, p.y - gy]),
        vx: ox / ol * sp + dx * R(60, 160), vy: oy / ol * sp + dy * R(60, 160) - R(40, 120),
        rot: 0, vr: R(-5, 5), life: 1, hue, k: it.b.k, col: `rgba(${tone},.78)`,
      });
    };
    // each wedge from the cut point breaks once more, into an inner splinter and an outer plate
    for (let i = 0; i < P.length; i++) {
      const a = P[i], b = P[(i + 1) % P.length], k1 = R(.36, .62), k2 = R(.36, .62);
      const a1 = { x: cx + (a.x - cx) * k1, y: cy + (a.y - cy) * k1 }, b1 = { x: cx + (b.x - cx) * k2, y: cy + (b.y - cy) * k2 };
      piece([{ x: cx, y: cy }, a1, b1], .65);
      piece([a1, a, b, b1], 1);
    }
    return out;
  }

  function breach(it) {
    it.state = 'breach'; it.t = 0; lives--; breaches++; flash = .45;
    shake = 1; lifeFx = { i: lives, t: 0 };
    fx.push({ type: 'breach', x: it.x, y: it.y, t: 0, dur: .5 });
    for (let i = 0; i < 10; i++) { const a = rand(0, TAU), v = rand(90, 260); addPart({ x: it.x, y: it.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: .5, max: .5, size: rand(1.6, 3), color: i % 2 ? '#e5484d' : '#ff9a8f' }); }
    pop(it.x, it.y - SR - 14, 'Governance breached', 17, '#d63c4a', 1.4);
    if (CHECKS[it.chk]) pop(it.x, it.y - SR + 7, CHECKS[it.chk].lost, 12.5, '#b3303d', 1.4);
    BS.sfx('breach');
    BS.vibrate([30, 40, 60]);
    if (lives <= 0) end();
  }
  function tap(x, y) {
    let best = null, bd = Infinity;
    for (const it of items) {
      if (it.kind !== 'seal' || it.state !== 'live') continue;
      const d = Math.hypot(it.x - x, it.y - y);
      if (d < SR + 16 && d < bd) { best = it; bd = d; }
    }
    if (!best) return;
    best.state = 'approved'; best.t = 0; approved++; score += 25;
    pop(best.x, best.y - SR * 1.75 - 14, `${CHECKS[best.chk] ? CHECKS[best.chk].ok : 'Approved'} +25`, 16, '#0e8a68');
    fx.push({ type: 'approve', x: best.x, y: best.y, t: 0, dur: .7 });
    for (let i = 0; i < 16; i++) { const a = i / 16 * TAU; addPart({ x: best.x, y: best.y, vx: Math.cos(a) * 180, vy: Math.sin(a) * 180, life: .5, max: .5, size: 2.4, color: i % 2 ? '#e0b04a' : '#2fbf96' }); }
    BS.sfx('approve');
    BS.vibrate(10);
  }
  function combo(n, x, y) {
    const b = 10 * n * (n - 1);
    score += b; bestCombo = Math.max(bestCombo, n);
    pop(x, y - 40, `×${n}`, n >= 4 ? 26 : 20, '#2b3a8f', 1.3, { tail: 'clear view', sub: `+${b}` });
    glints(clamp(x, 90, W - 90), Math.max(120, y - 40), 8, 520, .7, .62);
    BS.sfx('combo', { n });
  }
  function pop(x, y, text, size, color, life = 1, big = null) {
    pops.push({ x: clamp(x, 80, W - 80), y: Math.max(big ? 122 : 92, y), text, size, color, life, max: life, big });
  }

  // ---------- flow ----------
  function start() {
    items = []; shards = []; reveals = []; pops = []; parts = []; trail = []; fx = [];
    time = 0; score = 0; lives = LIVES; cleared = 0; approved = 0; breaches = 0; seen = 0; bestCombo = 0; warnSec = 0;
    spawnCd = .3; sealHints = 0; checkBag = []; flash = 0; ptr = null; over = false; running = true;
    shake = 0; lifeFx = null; shownScore = 0; scoreT = -9;
    placeHint();
    prewarm();
  }
  // One plain-English line that ties the round back to the theme.
  function takeaway() {
    const times = n => n === 1 ? 'once' : n === 2 ? 'twice' : n === 3 ? 'three times' : `${n} times`;
    const what = cleared ? `${BS.pl(cleared, 'barrier')} cleared` : 'No barriers cleared';
    if (lives <= 0) return `${what}, and three governance breaches ended the round. Ungoverned AI costs more than it saves.`;
    if (breaches) return `${what}, ${cleared ? 'but' : 'and'} governance was breached ${times(breaches)}.`;
    if (!cleared) return 'No barriers cleared, so your agent is still looking at frosted glass.';
    if (approved) return `${what}, ${BS.pl(approved, 'seal')} approved and governance intact.`;
    return `${what} and governance intact.`;
  }
  function end() {
    if (over) return;
    running = false; over = true; ptr = null; overAt = clock;
    setTimeout(() => BS.finish({
      score,
      headline: lives <= 0 ? 'Governance breached' : 'Time',
      theme: takeaway(),
      stats: { cleared, approved, combo: bestCombo, breaches },
      win: false,
    }), 900);
  }

  function update(dt) {
    clock += dt;
    if (running) {
      time += dt;
      const left = DURATION - time;
      if (left > 0 && left <= 5 && Math.ceil(left) !== warnSec) { warnSec = Math.ceil(left); BS.sfx('warn'); }
      if (time >= DURATION) end();
    }
    const p = running ? clamp(time / DURATION, 0, 1) : 0;
    spawnCd -= dt;
    if (!over && spawnCd <= 0) {
      spawn(p);
      if (running && Math.random() < .15 + .2 * p) spawn(p);
      spawnCd = running ? lerp(.95, .42, p) : 1.4;
    }
    for (const it of items) {
      it.age += dt; it.t += dt;
      if (it.state === 'live') {
        it.y += it.vy * dt; it.x = it.x0 + Math.sin(it.age * it.swayF * 2 + it.ph) * it.swayA; it.rot += it.vr * dt;
      }
    }
    items = items.filter(it => (it.state === 'live' && it.y > -PH) || (it.state === 'breach' && it.t < .9) || (it.state === 'approved' && it.t < .5));
    for (const s of shards) { s.life -= dt * 1.1; s.vy += 900 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt; }

      put(c, glintSprite(SPARK[i % 5]), p.x - (p.y - q.y) / l * off, p.y + (p.x - q.x) / l * off, .28 + k * .42);
    }
    // the tip
    const kh = clamp(1 - (now - b.t) / .16, 0, 1);
    c.globalAlpha = ga * kh; put(c, glow('255,255,255'), b.x, b.y, .26); put(c, glintSprite('255,255,255'), b.x, b.y, .4 + kh * .25);
    c.restore();
  }

  function outlined(c, text, x, y, fill) {
    c.strokeText(text, x, y); c.fillStyle = fill; c.fillText(text, x, y);
  }
  function drawPop(c, q, w) {
    const age = q.max - q.life, ga = c.globalAlpha;
    c.save(); c.globalAlpha = ga * clamp(q.life / q.max * 2.5, 0, 1);
    c.lineJoin = 'round'; c.strokeStyle = 'rgba(255,255,255,.95)';
    if (q.big) {
      // combo: "×3 clear view", set large in a prism gradient
      const s1 = q.size * 2.1, s2 = q.size * 1.08, f1 = `700 ${s1}px ${FONT}`, f2 = `700 ${s2}px ${FONT}`, gap = s2 * .3;
      c.font = f1; const w1 = c.measureText(q.text).width;
      c.font = f2; const w2 = c.measureText(q.big.tail).width;
      const tw = w1 + gap + w2, x = clamp(q.x, tw / 2 + 16, w - tw / 2 - 16), x0 = x - tw / 2, by = q.y + s1 * .3;
      const sc = RM ? 1 : .55 + .45 * back(clamp(age / .24, 0, 1));
      c.translate(x, q.y); c.scale(sc, sc); c.translate(-x, -q.y);
      c.drawImage(glow('255,255,255').el, x - tw * .8, q.y - s1 * 1.15, tw * 1.6, s1 * 2.5);
      const g = c.createLinearGradient(x0, 0, x0 + tw, 0);
      PRISM.forEach((col, i) => g.addColorStop(i / 4, col));
      c.textAlign = 'left'; c.textBaseline = 'alphabetic';
      c.fillStyle = 'rgba(43,58,143,.2)';
      c.font = f1; c.fillText(q.text, x0, by + 3); c.font = f2; c.fillText(q.big.tail, x0 + w1 + gap, by + 2.5);
      c.font = f1; c.lineWidth = s1 * .15; outlined(c, q.text, x0, by, g);
      c.font = f2; c.lineWidth = s2 * .26; outlined(c, q.big.tail, x0 + w1 + gap, by, g);
      c.font = `700 ${q.size * .78}px ${FONT}`; c.textAlign = 'center'; c.lineWidth = q.size * .22;
      outlined(c, q.big.sub, x, by + q.size * 1.05, q.color);
    } else {
      c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = `700 ${q.size}px ${FONT}`;
      const hw = c.measureText(q.text).width / 2 + 12, x = clamp(q.x, hw, w - hw);
      c.lineWidth = Math.max(3, q.size * .26);
      outlined(c, q.text, x, q.y, q.color);
    }
    c.restore();
  }

  // Lives: small gold seals on a glass chip, right edge at xr. bi/ba animate life bi breaking, ba seconds in.
  function drawLives(c, xr, y, n, bi = -1, ba = 0) {
    const cw = 86, ga = c.globalAlpha, at = i => xr - 19 - i * 24;
    put(c, pillSprite(cw, 34), xr - cw / 2, y);
    if (bi >= 0 && ba < .5) { c.globalAlpha = ga * (1 - ba / .5) * .42; c.fillStyle = '#e5484d'; rr(c, xr - cw, y - 17, cw, 34, 17); c.fill(); c.globalAlpha = ga; }
    for (let i = 0; i < LIVES; i++) {
      const x = at(i);
      if (i < n) { put(c, sealSprite(LIFE_R, false), x, y); continue; }
      c.fillStyle = 'rgba(29,37,64,.05)'; c.beginPath(); c.arc(x, y, 8.5, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(29,37,64,.2)'; c.lineWidth = 1.3; c.stroke();
      c.lineJoin = 'round'; c.lineCap = 'round'; c.beginPath(); c.moveTo(x - 1.2, y - 4.6); c.lineTo(x + 1.6, y - 1.2); c.lineTo(x - 1.6, y + 1.4); c.lineTo(x + 1, y + 4.6); c.stroke();
    }
    if (bi >= 0 && ba < .7) {
      // the lost life cracks in two and drops away
      const x = at(bi), k = ba / .7, s = sealSprite(LIFE_R, true);
      for (const side of [-1, 1]) {
        c.save(); c.globalAlpha = ga * clamp(1 - k * k, 0, 1);
        c.translate(x + side * ba * 24, y + ba * ba * 170); c.rotate(side * ba * 3.2);
        c.beginPath(); c.rect(side < 0 ? -18 : 0, -18, 18, 36); c.clip();
        put(c, s); c.restore();
      }
      c.strokeStyle = `rgba(229,72,77,${1 - k})`; c.lineWidth = 2.2 * (1 - k) + .4;
      c.beginPath(); c.arc(x, y, 10 + k * 15, 0, TAU); c.stroke();
    }
    c.globalAlpha = ga;
  }

  // Tray: what your agent can now see. It bumps and its count ticks up as each document lands.
  // The label shortens when the tray is narrow (small phones, the tutorial's canvas).
  const TRAY_LABELS = ['Your agent can see', 'Agent can see', 'Agent sees'];
  function traySprite(tw) {
    const pill = pillSprite(tw, 34);
    return sprite('tray:' + tw, pill.w, pill.h, c => {
      c.drawImage(pill.el, 0, 0, pill.w, pill.h);
      c.translate(pill.w / 2, pill.h / 2);
      c.font = `700 12px ${FONT}`;
      const label = TRAY_LABELS.find(l => 15 + c.measureText(l).width + 6 + 18 <= tw - 16) || TRAY_LABELS[2];
      const lw = c.measureText(label).width, total = 15 + lw + 6 + 16, x0 = -total / 2;
      c.fillStyle = 'rgba(22,163,127,.18)'; c.beginPath(); c.arc(x0 + 4, 0, 7, 0, TAU); c.fill();
      c.fillStyle = '#16a37f'; c.beginPath(); c.arc(x0 + 4, 0, 3.8, 0, TAU); c.fill();
      c.fillStyle = 'rgba(29,37,64,.74)'; c.textAlign = 'left'; c.textBaseline = 'middle';
      c.fillText(label, x0 + 15, 1);
      return { dot: x0 + 4, nx: x0 + 15 + lw + 6 };
    });
  }
  function drawTray(c, x, y, n, pulse, tw = 140) {
    const s = traySprite(tw), d = s.data, ga = c.globalAlpha, e = 1 - pulse;
    c.save(); c.translate(x, y); c.scale(1 + pulse * .1, 1 + pulse * .1);
    put(c, s);
    c.fillStyle = INK; c.font = `700 14px ${FONT}`; c.textAlign = 'left'; c.textBaseline = 'middle';
    if (pulse > 0 && n > 0) {
      c.globalAlpha = ga * pulse;
      c.strokeStyle = '#16a37f'; c.lineWidth = 1.6; rr(c, -tw / 2, -17, tw, 34, 17); c.stroke();
      c.strokeStyle = 'rgba(22,163,127,.6)'; c.lineWidth = 1.4; c.beginPath(); c.arc(d.dot, 0, 5 + e * 9, 0, TAU); c.stroke();
      c.fillText(n - 1, d.nx, 1 - e * 9);
      c.globalAlpha = ga * e; c.fillText(n, d.nx, 1 + pulse * 9);
    } else c.fillText(n, d.nx, 1);
    c.restore();
  }

  // Breach feedback: a red wash and a vignette at the screen edges.
  function drawFlash(c, w, h, f) {
    if (f <= 0) return;
    const k = clamp(f / .45, 0, 1), ga = c.globalAlpha;
    c.fillStyle = `rgba(214,60,74,${k * (RM ? .03 : .09)})`; c.fillRect(0, 0, w, h);
    c.globalAlpha = ga * Math.min(1, k * 1.7) * (RM ? .55 : 1);
    c.drawImage(vignette().el, 0, 0, w, h);
    c.globalAlpha = ga;
  }

  function drawHud() {
    // prism timer along the very top; it pulses through the last ten seconds
    ctx.fillStyle = 'rgba(29,37,64,.07)'; ctx.fillRect(0, 0, W, 5);
    if (running || over) {
      const left = DURATION - time, x1 = W * clamp(1 - time / DURATION, 0, 1), hot = running && left <= 10;
      const beat = hot ? .5 + .5 * Math.sin(clock * (left <= 5 ? 13 : 8)) : 0, th = 5 + (RM ? 0 : beat * 2.5);
      if (x1 > 0) {
        ctx.fillStyle = timerGrad; rr(ctx, -10, -th, x1 + 10, th * 2, th); ctx.fill();
        if (hot) { ctx.fillStyle = `rgba(255,70,110,${.25 + beat * .5})`; rr(ctx, -10, -th, x1 + 10, th * 2, th); ctx.fill(); }
        ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(0, 0, x1 - th * .6, 1.2);
        ctx.globalAlpha = hot ? .55 + beat * .45 : .8;
        put(ctx, glow(hot ? '255,90,130' : '255,255,255'), x1 - 1, th / 2, hot ? .2 + beat * .12 : .14);
        ctx.globalAlpha = 1;
      }
    }
    if (!running && !over) return;
    // the HUD bows out before the result card arrives
    const hudA = over ? clamp(1 - (clock - overAt - .4) / .35, 0, 1) : 1;
    if (hudA <= 0) return;
    ctx.globalAlpha = hudA;
    // score, on its own glass chip; it gives a small bump when it changes
    if (score !== shownScore) { shownScore = score; scoreT = clock; }
    const bump = RM ? 0 : Math.max(0, 1 - (clock - scoreT) / .28);
    const tw = trayW, txt = BS.fmt(score);
    let fs = 23;
    ctx.font = `700 ${fs}px ${FONT}`;
    let nw = ctx.measureText(txt).width;
    const room = trayX - tw / 2 - 16 - 28;
    if (nw > room) { fs = Math.max(15, fs * room / nw); ctx.font = `700 ${fs}px ${FONT}`; nw = ctx.measureText(txt).width; }
    const cw = Math.max(72, Math.ceil((nw + 28) / 6) * 6);
    put(ctx, pillSprite(cw, 46, 15), 10 + cw / 2, HUD_Y);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(86,100,138,.9)'; ctx.font = `700 8.5px ${FONT}`; spaced(ctx, 'SCORE', 24, HUD_Y - 9, 1.3, true);
    ctx.save(); ctx.translate(24, HUD_Y + 15); ctx.scale(1 + bump * .14, 1 + bump * .14);
    ctx.fillStyle = INK; ctx.font = `700 ${fs}px ${FONT}`; ctx.textAlign = 'left'; ctx.fillText(txt, 0, 0);
    ctx.restore();
    drawLives(ctx, W - 10, HUD_Y, lives, lifeFx ? lifeFx.i : -1, lifeFx ? lifeFx.t : 0);
    drawTray(ctx, trayX, HUD_Y, seen, trayPulse, tw);
    ctx.globalAlpha = 1;
    if (running && time < 5) {
      ctx.save(); ctx.globalAlpha = Math.min(1, (5 - time) / 1.2);
      put(ctx, labelSprite('Swipe the glass · tap the gold seals', `700 12.5px ${FONT}`, 'rgba(29,37,64,.82)', 32), W / 2, hintY - 14);
      ctx.restore();
    }
  }

  function draw() {
    drawBg(ctx, W, H, clock);
    ctx.save();
    if (shake > 0 && !RM) { const m = shake * shake * 8; ctx.translate(Math.sin(clock * 73) * m, Math.cos(clock * 57) * m); }
    for (const it of items) it.kind === 'pane' ? (it.state === 'live' && drawPane(ctx, it, PW)) : drawSeal(ctx, it, SR);
    if (running || over) { ctx.fillStyle = fadeGrad; ctx.fillRect(-12, -12, W + 24, 116); }
    for (const r of reveals) drawReveal(ctx, r, PW, trayX, HUD_Y);
    for (const s of shards) drawShard(ctx, s);
    for (const f of fx) drawFx(ctx, f);
    drawParts(ctx, parts);
    drawTrail(ctx, trail, clock);
    ctx.restore();
    drawHud();
    for (const q of pops) drawPop(ctx, q, W);
    drawFlash(ctx, W, H, flash);
  }
  // Paint the round's sprites up front so the first cut never hitches.
  function prewarm() {
    for (const b of BARRIERS) paneSprite(b, PW);
    for (const d of DOCS) { docSprite(d, PW); hintSprite(d.c, PW); }
    for (const red of [false, true]) { sealSprite(SR, red); sealSprite(LIFE_R, red); }
    slashSprite(); vignette(); SPARK.forEach(glintSprite);
  }

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    if (!BS.paused) update(dt); // frozen behind the pause card
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- tutorial demos: each frame is drawn from t alone, with the demo's own data ----------
  const HAND = '#1d2540';
  const demoCache = new Map();
  const cached = (key, make) => { if (!demoCache.has(key)) demoCache.set(key, make()); return demoCache.get(key); };
  const demoPane = w => clamp(w * .26, 64, 82); // 2–3 panes fit the small canvas
  // A straight swipe from (ax, ay) to (bx, by) between times t0 and t1.
  const swipePos = (sw, t) => { const k = clamp((t - sw.t0) / (sw.t1 - sw.t0), 0, 1); return { x: lerp(sw.ax, sw.bx, k), y: lerp(sw.ay, sw.by, k) }; };
  const swipeTime = (sw, x) => sw.t0 + (sw.t1 - sw.t0) * clamp((x - sw.ax) / (sw.bx - sw.ax), 0, 1);
  function swipeTrail(sw, t) {
    const pts = [], a = Math.max(sw.t0, t - .16), b = Math.min(sw.t1, t);
    for (let s = a; s <= b + 1e-6; s += 1 / 60) pts.push({ ...swipePos(sw, s), t: s });
    return pts;
  }
  function swipeHand(c, sw, t) {
    if (t < sw.t0 - .5 || t > sw.t1 + .45) return;
    const p = swipePos(sw, t);
    BS.drawHand(c, p.x, p.y, t >= sw.t0 && t <= sw.t1, HAND);
  }
  // Shards a seconds after the cut, using the same motion as the game.
  function shardsAt(c, list, a) {
    const life = 1 - a * 1.1;
    if (a < 0 || life <= 0) return;
    for (const s of list) drawShard(c, { pts: s.pts, hue: s.hue, k: s.k, col: s.col, life, x: s.x + s.vx * a, y: s.y + s.vy * a + 450 * a * a, rot: s.vr * a });
  }
  // The prismatic flash where the swipe crosses the pane.
  function slashAt(c, it, pw, sw, a) {
    if (a < 0 || a >= .3) return;
    const p = cutPoint(it, pw, sw.ax, sw.ay, sw.bx, sw.by);
    drawSlash(c, p.x, p.y, Math.atan2(sw.by - sw.ay, sw.bx - sw.ax), pw * 2.3, a);
  }
  function popAt(c, w, x, y, a, text, size, color, max = 1, big = null) {
    if (a < 0 || a >= max) return;
    drawPop(c, { x, y: y - (big ? 14 : 28) * a, text, size, color, life: max - a, max, big }, w);
  }
  // The burst on approval: 16 sparks, damped like the game's particles.
  function burstAt(c, x, y, a) {
    if (a < 0 || a >= .5) return;
    const d = 27 * (1 - Math.pow(.9, a * 60)), list = [];
    for (let i = 0; i < 16; i++) { const ang = i / 16 * TAU; list.push({ x: x + Math.cos(ang) * d, y: y + Math.sin(ang) * d, life: .5 - a, max: .5, size: 2.4, color: i % 2 ? '#e0b04a' : '#2fbf96' }); }
    drawParts(c, list);
  }
  // Reveal card a seconds after the cut; hold keeps it on screen before it flies to the tray.
  function revealAt(c, r, pw, a, hold, tx, ty) {
    if (a < 0) return;
    const rt = !hold || a < .45 ? a : a < .45 + hold ? .45 : a - hold;
    if (rt < 1.05) drawReveal(c, { ...r, t: rt }, pw, tx, ty);
  }
  const fadeIn = (c, k, fn) => { c.save(); c.globalAlpha = clamp(k, 0, 1); fn(); c.restore(); };
  const TRAY_Y = 25;

  function demoCut(c, w, h, T) {
    const t = T % 3.8, pw = demoPane(w), ph = pw * 1.28, HOLD = 1.1; // loops soon after the document lands, so the frame is never empty for long
    drawBg(c, w, h, T);
    const base = { x: w / 2, y: h / 2 + 22, rot: -.05, b: BARRIERS[0], doc: DOCS[0], age: T };
    const sw = { ax: base.x - pw / 2 - 46, ay: base.y - ph * .32, bx: base.x + pw / 2 + 46, by: base.y + ph * .2, t0: .8, t1: 1.35 };
    const tc = swipeTime(sw, base.x - pw / 2 + 4), arrive = tc + 1.05 + HOLD;
    const bob = k => ({ ...base, y: base.y + Math.sin(k * 1.8) * 3 });
    const pane = bob(Math.min(t, tc)), n = t >= arrive ? 1 : 0;
    if (t < tc) fadeIn(c, t / .35, () => drawPane(c, pane, pw));
    revealAt(c, pane, pw, t - tc, HOLD, w / 2, TRAY_Y);
    shardsAt(c, cached(`cut:${w}x${h}`, () => makeShards(bob(tc), pw, sw.ax, sw.ay, sw.bx, sw.by, seeded(11))), t - tc);
    slashAt(c, bob(tc), pw, sw, t - tc);
    drawTrail(c, swipeTrail(sw, t), t);
    drawTray(c, w / 2, TRAY_Y, n, n ? Math.max(0, 1 - (t - arrive) * 3) : 0);
    popAt(c, w, pane.x, pane.y - ph / 2 - 8, t - tc, '+10', 15, SLATE);
    swipeHand(c, sw, t);
  }

  function demoCombo(c, w, h, T) {
    const t = T % 4.4, pw = demoPane(w), ph = pw * 1.28;
    drawBg(c, w, h, T);
    const gap = clamp((w - pw * 3) / 4, 4, 12), cy = h / 2 + 26;
    const sw = { ax: 14, ay: cy - 10, bx: w - 14, by: cy + 8, t0: .8, t1: 1.6 };
    const panes = [0, 1, 2].map(i => ({ x: w / 2 + (i - 1) * (pw + gap), y: cy + [-6, 6, -2][i], rot: [-.06, .05, -.03][i], b: BARRIERS[i + 1], doc: DOCS[[1, 7, 0][i]], age: T, ph: i * 1.7 }));
    const tcs = panes.map(p => swipeTime(sw, p.x - pw / 2 + 4));
    const got = tcs.filter(tc => t >= tc + 1.05).length;
    panes.forEach((p, i) => { if (t < tcs[i]) fadeIn(c, t / .35, () => drawPane(c, p, pw)); });
    panes.forEach((p, i) => revealAt(c, p, pw, t - tcs[i], 0, w / 2, TRAY_Y));
    panes.forEach((p, i) => shardsAt(c, cached(`combo${i}:${w}x${h}`, () => makeShards(p, pw, sw.ax, sw.ay, sw.bx, sw.by, seeded(21 + i))), t - tcs[i]));
    panes.forEach((p, i) => slashAt(c, p, pw, sw, t - tcs[i]));
    drawTrail(c, swipeTrail(sw, t), t);
    drawTray(c, w / 2, TRAY_Y, got, got ? Math.max(0, 1 - (t - tcs[got - 1] - 1.05) * 3) : 0);
    panes.forEach((p, i) => popAt(c, w, p.x, p.y - ph / 2 - 8, t - tcs[i], '+10', 15, SLATE));
    popAt(c, w, w / 2, cy - 4, t - sw.t1, '×3', 20, '#2b3a8f', 1.3, { tail: 'clear view', sub: '+60' });
    swipeHand(c, sw, t);
  }

  function demoTap(c, w, h, T) {
    const t = T % 3.6, sr = demoPane(w) * .37, tapT = 1.3;
    drawBg(c, w, h, T);
    const seal = { x: w / 2, y: h / 2 - 14, age: T, t: 0, state: 'live', hint: true, chk: 0 }, a = t - tapT;
    if (a < 0) fadeIn(c, t / .3, () => drawSeal(c, seal, sr));
    else if (a < .5) drawSeal(c, { ...seal, state: 'approved', t: a }, sr);
    drawApprove(c, seal.x, seal.y, a, sr);
    burstAt(c, seal.x, seal.y, a);
    popAt(c, w, seal.x, seal.y - sr * 1.75 - 14, a, `${CHECKS[0].ok} +25`, 16, '#0e8a68');
    // fingertip: glide in, press, release (the tap lands on release), lift away
    const home = { x: w / 2 + 92, y: h - 26 }, kin = BS.ease((t - .3) / .7), kout = BS.ease((t - tapT - .2) / .6);
    const p = t < tapT + .2 ? { x: lerp(home.x, seal.x, kin), y: lerp(home.y, seal.y, kin) } : { x: lerp(seal.x, home.x, kout), y: lerp(seal.y, home.y, kout) };
    if (t > .2 && t < tapT + 1.1) BS.drawHand(c, p.x, p.y, t >= 1.05 && t < tapT, HAND);
  }

  function demoBreach(c, w, h, T) {
    const t = T % 3.8, sr = demoPane(w) * .37;
    drawBg(c, w, h, T);
    const seal = { x: w / 2, y: h / 2 + 14, age: T, t: 0, state: 'live', chk: 3 };
    const sw = { ax: seal.x - 112, ay: seal.y - 50, bx: seal.x + 112, by: seal.y + 34, t0: .75, t1: 1.3 };
    const tc = swipeTime(sw, seal.x - sr * .7), a = t - tc;
    if (a < 0) fadeIn(c, t / .3, () => drawSeal(c, seal, sr));
    else if (a < .9) drawSeal(c, { ...seal, state: 'breach', t: a }, sr);
    drawBreach(c, seal.x, seal.y, a, sr);
    drawTrail(c, swipeTrail(sw, t), t);
    // lives, laid out as in the game's HUD; the left-most one breaks
    drawLives(c, w - 10, TRAY_Y, a >= 0 ? LIVES - 1 : LIVES, a >= 0 ? LIVES - 1 : -1, Math.max(0, a));
    popAt(c, w, seal.x, seal.y - sr - 14, a, 'Governance breached', 17, '#d63c4a', 1.4);
    popAt(c, w, seal.x, seal.y - sr + 7, a, CHECKS[3].lost, 12.5, '#b3303d', 1.4);
    swipeHand(c, sw, t);
    if (a >= 0) drawFlash(c, w, h, .45 - a);
  }

  const TUTORIAL = [
    { title: 'Swipe to cut', text: 'Swipe through a frosted pane to shatter it. Each one is a barrier: a silo, a legacy app, hidden or scattered data.', demo: demoCut },
    { title: 'Cut several at once', text: 'Cut through several panes in one swipe for a combo bonus.', demo: demoCombo },
    { title: 'Tap the gold seals', text: 'Gold seals are trusted context. Each one checks a source, an owner, that data is current or that it is cleared for use, so your agent knows it is safe to act. Tap to approve.', demo: demoTap },
    { title: 'Never cut a seal', text: `Swiping through a seal is a governance breach, the hidden cost of ungoverned AI. Three breaches and your round ends. Rounds last ${DURATION} seconds.`, demo: demoBreach },
  ];

  if (BS.params.has('debug')) window.__dbg = { items: () => items, score: () => score, lives: () => lives, step: (n = 1) => { for (let i = 0; i < n; i++) update(1 / 60); draw(); } };
  resize();
  window.addEventListener('resize', resize);
  BS.init({
