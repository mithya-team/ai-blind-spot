<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Deep Dive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/common.css?v=16">
<style>
  :root {
    --bg: #071521; --fg: #e3f6ff; --accent: #7fe3ff; --on-accent: #04121c;
    --card: rgba(6, 20, 32, .84); --line: rgba(127, 227, 255, .22); --chip: rgba(127, 227, 255, .07);
    --input: rgba(255, 255, 255, .05); --scrim: rgba(2, 8, 14, .4); --shadow: 0 24px 70px rgba(0, 0, 0, .6);
    --font-display: Inter, -apple-system, sans-serif; --display-weight: 700; --font-ui: Inter, -apple-system, sans-serif;
    --display-tracking: -.025em; --demo-bg: #0b2233;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="shared/common.js?v=16"></script>
<script>
(() => {
  const cv = document.getElementById('c');
  /* The world is measured internally on a "year" axis (a leftover unit: one year = YEAR_PX of fall). The player
     only ever sees depth: 100 m per internal year, so the surface is 0 m, the layers start at
     0 / 1,100 / 2,100 / 3,100 / 4,100 / 5,100 m and the bottom is 6,200 m. */
  const START_YEAR = 2026, END_YEAR = 1964, YEAR_PX = 620;
  const TOTAL = (START_YEAR - END_YEAR) * YEAR_PX;
  const M_PER_YEAR = 100, BOTTOM_M = (START_YEAR - END_YEAR) * M_PER_YEAR;
  const metres = y => (START_YEAR - y) * M_PER_YEAR; // internal year -> shown depth
  const yearOf = m => START_YEAR - m / M_PER_YEAR;   // shown depth -> internal year
  const commas = n => n < 1000 ? String(n) : Math.floor(n / 1000) + ',' + String(n % 1000).padStart(3, '0');
  const fmtM = m => commas(Math.floor(m)) + ' m';
  // each layer is its own stratum: bg/deep tint the water, dark tints the shadows, acc is its light
  const LAYERS = [
    { from: 2026, name: 'Cloud apps', style: 'glass', bg: [20, 94, 138], deep: [9, 44, 76], dark: [2, 13, 26], acc: [127, 227, 255] },
    { from: 2015, name: 'Shared drives', style: 'folder', bg: [22, 90, 92], deep: [10, 44, 50], dark: [3, 15, 19], acc: [255, 208, 116] },
    { from: 2005, name: 'Email archives', style: 'mail', bg: [50, 55, 140], deep: [23, 25, 76], dark: [8, 9, 30], acc: [178, 190, 255] },
    { from: 1995, name: 'Legacy applications', style: 'box', bg: [26, 82, 68], deep: [12, 40, 36], dark: [3, 14, 13], acc: [134, 240, 170] },
    { from: 1985, name: 'Systems of record', style: 'frame', bg: [80, 50, 88], deep: [36, 22, 42], dark: [12, 6, 16], acc: [255, 132, 156] },
    { from: 1975, name: 'Offline archives', style: 'cabinet', bg: [102, 70, 40], deep: [48, 32, 18], dark: [16, 10, 5], acc: [255, 218, 158] },
  ];
  const NL = LAYERS.length;
  for (const e of LAYERS) {
    e.pool = e.bg.map(v => Math.min(255, v * 2.3 + 24)); // what the lantern's pool lights the water to
    e.lit = e.bg.map((v, k) => v * .5 + e.pool[k] * .5); // the layer with the lights on
  }
  const WHITE = [255, 255, 255], COOL = [120, 218, 255], WARM = [255, 122, 72];
  const C_PICK = [158, 234, 255], C_HIT = [255, 143, 122];
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const mod = (a, n) => ((a % n) + n) % n;
  const hash = n => mod(Math.sin(n * 12.9898) * 43758.5453, 1);
  const yearAt = d => START_YEAR - d / YEAR_PX;
  const layerIdx = y => { for (let i = NL - 1; i >= 0; i--) if (y <= LAYERS[i].from) return i; return 0; };
  const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const FX = RM ? .3 : 1; // shake and flashes are toned down for reduced motion
  const DPR = Math.min(2, window.devicePixelRatio || 1);

  let ctx, W, H, PY, PR = 11, SAFE_B = 0, SAFE_T = 0;
  let depth = 0, px = 0, tx = 0, light = 100, inv = 0, shake = 0, frags = 0, hits = 0, bonus = 0, warnT = 0;
  let running = false, over = false, won = false, clock = 0, runTime = 0, lightsOn = 0;
  let rows = [], items = [], trailPts = [], parts = [], pops = [], banner = null, nextY = 0, lastGapC = 0, layerNow = 0;
  // purely visual state
  let sparks = [], flies = [], sparkAcc = 0, vel = 0, hitFx = null, gotFx = 0, layerFx = 0, outFx = 0;
  let drag = null;
  // ?from=3000 starts the dive 3,000 m down (test hook)
  const startDepth = clamp(+BS.params.get('from') || 0, 0, BOTTOM_M - M_PER_YEAR) / M_PER_YEAR * YEAR_PX;

  // reads the safe-area insets so the HUD clears the notch and bottom text clears the shell's mode pill
  const safeEl = document.createElement('div');
  safeEl.style.cssText = 'position:fixed;left:0;bottom:0;width:0;height:0;padding-bottom:env(safe-area-inset-bottom);padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none';
  document.body.append(safeEl);

  function resize() {
    ({ ctx, w: W, h: H } = BS.fit(cv));
    const cs = getComputedStyle(safeEl);
    SAFE_B = parseFloat(cs.paddingBottom) || 0; SAFE_T = parseFloat(cs.paddingTop) || 0;
    PY = H * .3;
    if (!running) { px = tx = W / 2; }
    px = clamp(px, PR, W - PR); tx = clamp(tx, PR, W - PR);
  }

  // ---------- world generation ----------
  function genRow() {
    const p = nextY / TOTAL;
    const layer = layerIdx(yearAt(nextY));
    const h = rand(30, 40);
    const gapW = Math.max(PR * 8, W * lerp(.5, .3, p));
    const row = { y: nextY, h, layer, blocks: [] };
    if (Math.random() < .62) {
      const c = clamp(lastGapC + rand(-1, 1) * W * .38, gapW / 2 + 8, W - gapW / 2 - 8);
      lastGapC = c;
      if (c - gapW / 2 > 6) row.blocks.push({ x: 0, w: c - gapW / 2 });
      if (W - (c + gapW / 2) > 6) row.blocks.push({ x: c + gapW / 2, w: W - (c + gapW / 2) });
      if (Math.random() < .55) items.push({ x: c, y: nextY + h / 2, ph: rand(0, 6) });
    } else {
      const bw = W * rand(.22, .42), bx = rand(0, W - bw);
      row.blocks.push({ x: bx, w: bw });
      const fx = bx > W / 2 ? rand(24, bx - 20) : rand(bx + bw + 20, W - 24);
      if (Math.random() < .7) items.push({ x: clamp(fx, 24, W - 24), y: nextY + h / 2, ph: rand(0, 6) });
    }
    rows.push(row);
    const gap = lerp(250, 178, p) + rand(0, 40);
    if (Math.random() < .5) items.push({ x: rand(30, W - 30), y: nextY + h + gap / 2, ph: rand(0, 6) });
    nextY += gap;
  }
  function genUntil(limit) { while (nextY < limit && nextY < TOTAL - 320) genRow(); }

  // ---------- input: relative steering, finger anywhere ----------
  cv.addEventListener('pointerdown', e => {
    drag = { id: e.pointerId, sx: e.clientX, t0: tx };
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  });
  cv.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    tx = clamp(drag.t0 + (e.clientX - drag.sx) * 1.3, PR + 2, W - PR - 2);
  });
  const up = e => { if (drag && e.pointerId === drag.id) drag = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') tx = clamp(tx - 44, PR, W - PR);
    if (e.key === 'ArrowRight') tx = clamp(tx + 44, PR, W - PR);
  });

  // ---------- flow ----------
  const layerKick = e => `Layer ${e + 1} of ${NL}`;
  function start() {
    depth = startDepth; light = 100; inv = 0; shake = 0; frags = 0; hits = 0; bonus = 0; runTime = 0; lightsOn = 0; warnT = 0;
    rows = []; items = []; parts = []; pops = []; trailPts = []; banner = null;
    sparks = []; flies = []; sparkAcc = 0; hitFx = null; gotFx = 0; layerFx = 0; outFx = 0;
    nextY = depth + H * .95; lastGapC = W / 2; px = tx = W / 2;
    layerNow = layerIdx(yearAt(depth + PY));
    over = false; won = false; running = true;
    genUntil(depth + H * 1.6);
    banner = { m: startDepth / YEAR_PX * M_PER_YEAR, sub: LAYERS[layerNow].name, kick: layerKick(layerNow), life: 2.2, max: 2.2 };
  }
  const depthM = () => Math.min(BOTTOM_M, (depth + PY) / YEAR_PX * M_PER_YEAR); // how deep the light is, in metres
  const totalScore = () => Math.floor((depth - startDepth) / YEAR_PX * 100) + frags * 25 + bonus;
  function finish() {
    const layerName = LAYERS[layerNow].name; // the deepest layer reached
    let theme;
    if (won) theme = `All the way down with context to spare. ${BS.pl(frags, 'document')} recovered.`;
    else if (hits >= 3 && hits > frags) theme = `Your AI ran out of context at ${layerName}. Legacy walls cut off its supply, and everything deeper stays a blind spot.`;
    else theme = `Your AI ran out of context at ${layerName}. Without more content to reach, everything deeper is a blind spot.`;
    BS.finish({
      score: totalScore(),
      headline: won ? 'All the way down' : 'Your AI ran out of context',
      theme,
      stats: { depth: Math.floor(depthM()), layers: layerNow + 1, layerName, docs: frags, hits },
      win: won,
    });
  }
  function endDark() {
    running = false; over = true;
    banner = { m: depthM(), sub: 'Your AI went dark here', life: 2.6, max: 2.6 };
    setTimeout(finish, 1300);
  }
  function endWin() {
    running = false; over = true; won = true;
    bonus = 1000 + Math.round(light * 10);
    banner = { m: BOTTOM_M, sub: 'Lights on, all the way down', life: 3, max: 3 };
    parts = [];
    for (let i = 0; i < 84; i++) burst(px, PY, 1, LAYERS[i % NL].acc, 420); // every layer's colour, set free
    setTimeout(finish, 3000); // the lights-on sweep runs for 1.5 s, then holds so the player can take it in
  }

  function hit() {
    if (inv > 0) return;
    light -= 26; inv = 1.1; shake = .35; hits++;
    burst(px, PY, 14, C_HIT, 200);
    pop(px, PY - 46, '−context', 15, '#ffab98');
    hitFx = { x: px, y: PY, t: 0 };
    BS.sfx('hit');
    BS.vibrate(60);
  }
  function burst(x, y, n, col, sp) {
    for (let i = 0; i < n && parts.length < 92; i++) {
      const a = rand(0, Math.PI * 2), s = rand(.3, 1) * sp;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.4, .9), max: .9, size: rand(1, 2.6), col });
    }
  }
  function pop(x, y, text, size, color) { pops.push({ x: clamp(x, 60, W - 60), y, text, size, color, life: 1, max: 1 }); }

  function update(dt) {
    clock += dt;
    shake = Math.max(0, shake - dt); inv = Math.max(0, inv - dt);
    px += (tx - px) * Math.min(1, dt * 14);
    const pAbs = depth / TOTAL;
    const v = running ? lerp(165, 340, pAbs) : (over ? 0 : 18);
    vel = v;
    if (running) {
      runTime += dt;
      depth += v * dt;
      genUntil(depth + H * 1.6);
      light -= (2.4 + 3.4 * pAbs) * dt;
      const wy = depth + PY;
      for (const r of rows) {
        if (r.y > wy + 50) break;
        if (r.y + r.h < wy - 50) continue;
        for (const b of r.blocks) {
          const cx = clamp(px, b.x, b.x + b.w), cy = clamp(wy, r.y, r.y + r.h);
          if (Math.hypot(px - cx, wy - cy) < PR) hit();
        }
      }
      for (const it of items) {
        if (it.taken || Math.abs(it.y - wy) > 40) continue;
        if (Math.hypot(it.x - px, it.y - wy) < PR + 17) {
          it.taken = true; frags++; light = Math.min(100, light + 15);
          burst(it.x, it.y - depth, 10, C_PICK, 120);
          pop(it.x, PY - 46, '+context', 14, '#d4f6ff');
          flies.push({ dx: it.x - px, dy: it.y - wy, k: 0 }); gotFx = 1; // the page spirals into the lantern
          BS.sfx('pickup', { n: frags });
          BS.vibrate(8);
        }
      }
      const e = layerIdx(yearAt(wy));
      if (e !== layerNow) { layerNow = e; layerFx = 1; banner = { m: metres(LAYERS[e].from), sub: LAYERS[e].name, kick: layerKick(e), life: 2.2, max: 2.2 }; BS.sfx('era'); }
      if (light < 25) { warnT -= dt; if (warnT <= 0) { BS.sfx('warn'); warnT = 1; } } else warnT = 0;
      if (light <= 0) { light = 0; endDark(); }
      else if (depth + PY >= TOTAL) endWin();
    }
    if (won) lightsOn = Math.min(1, lightsOn + dt / 1.5);
    rows = rows.filter(r => r.y + r.h > depth - 60);
    items = items.filter(it => it.y > depth - 60 && !it.taken);
    trailPts.unshift({ x: px, y: depth + PY }); if (trailPts.length > 22) trailPts.pop();
    for (const q of parts) { q.life -= dt; q.vx *= .95; q.vy *= .95; q.x += q.vx * dt; q.y += q.vy * dt; }
    parts = parts.filter(q => q.life > 0);
    for (const q of pops) { q.life -= dt; q.y -= 24 * dt; }
    pops = pops.filter(q => q.life > 0);
    if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
    // visual-only: sparks shed by the lantern, pages flying in, effect timers
    if (running) {
      sparkAcc += dt * (RM ? 14 : 34);
      while (sparkAcc >= 1) {
        sparkAcc--;
        if (sparks.length < 56) sparks.push({ x: px + rand(-5, 5), y: depth + PY + rand(-5, 3), vx: rand(-15, 15), vy: rand(-26, 12), life: 0, max: rand(.35, .85), s: rand(.8, 2.1) });
      }
    }
    for (const q of sparks) { q.life += dt; q.x += q.vx * dt; q.y += q.vy * dt; }
    sparks = sparks.filter(q => q.life < q.max);
    for (const f of flies) f.k += dt / .36;
    flies = flies.filter(f => f.k < 1);
    if (hitFx) { hitFx.t += dt; if (hitFx.t > .6) hitFx = null; }
    gotFx = Math.max(0, gotFx - dt / .6); layerFx = Math.max(0, layerFx - dt / 1.1);
    if (over && !won) outFx = Math.min(1, outFx + dt / 1.1);
  }

  // ---------- drawing (shared by the game and the tutorial demos; every helper takes its context) ----------
  const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const TRK = new Map(); // tracked caps: thin spaces between letters
  const trk = s => { let v = TRK.get(s); if (!v) TRK.set(s, v = s.toUpperCase().split('').join('\u200A')); return v; };
  function mkCanvas(w, h, sc = DPR) {
    const el = document.createElement('canvas');
    el.width = Math.ceil(w * sc); el.height = Math.ceil(h * sc);
    const g = el.getContext('2d'); g.scale(sc, sc);
    return { cv: el, g };
  }
  const lin = (g, y0, y1, ...st) => { const lg = g.createLinearGradient(0, y0, 0, y1); for (let i = 0; i < st.length; i += 2) lg.addColorStop(st[i], st[i + 1]); return lg; };
  // the layer(s) a point on the internal axis sits in: [above, below, blend], blending across a narrow band at each boundary
  function layerMix(year, bw) {
    const i = layerIdx(year);
    if (i < NL - 1 && year < LAYERS[i + 1].from + bw) return [i, i + 1, (LAYERS[i + 1].from + bw - year) / (2 * bw)];
    if (i > 0 && year > LAYERS[i].from - bw) return [i - 1, i, (LAYERS[i].from + bw - year) / (2 * bw)];
    return [i, i, 0];
  }
  const layerCol = (key, year, bw) => { const [a, b, t] = layerMix(year, bw); return a === b ? LAYERS[a][key] : mixc(LAYERS[a][key], LAYERS[b][key], clamp(t, 0, 1)); };

  // pre-rendered glows. Only ever called with the constant palette arrays above, so the cache stays small.
  function glow(col, hard) {
    const k = hard ? '_gh' : '_gs';
    if (col[k]) return col[k];
    const S = mkCanvas(96, 96, 1), g = S.g, rg = g.createRadialGradient(48, 48, 0, 48, 48, 48);
    if (hard) {
      rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(.14, rgb(mixc(col, WHITE, .6), .95));
      rg.addColorStop(.38, rgb(col, .42)); rg.addColorStop(.68, rgb(col, .1)); rg.addColorStop(1, rgb(col, 0));
    } else {
      rg.addColorStop(0, rgb(col, .6)); rg.addColorStop(.3, rgb(col, .36)); rg.addColorStop(.62, rgb(col, .11)); rg.addColorStop(1, rgb(col, 0));
    }
    g.fillStyle = rg; g.fillRect(0, 0, 96, 96);
    return col[k] = S.cv;
  }
  const spot = (c, spr, x, y, rx, ry = rx) => c.drawImage(spr, x - rx, y - ry, rx * 2, ry * 2);

  /* --- backdrop: layer-tinted water, a faint texture per stratum, light shafts from above, the lantern's pool ---
     These are all gradients and faint lines, so they are painted into a half-resolution canvas and scaled up in one
     opaque blit: a quarter of the fill cost, and the slight softness reads as depth. */
  const BQ = Math.max(.75, DPR / 2), backs = new Map();
  function backdrop(w, h) {
    const key = Math.round(w) + 'x' + Math.round(h);
    let b = backs.get(key);
    if (!b) {
      if (backs.size > 2) backs.clear(); // game + one tutorial demo; anything else is a stale size
      const el = document.createElement('canvas');
      el.width = Math.ceil(w * BQ); el.height = Math.ceil(h * BQ);
      backs.set(key, b = { cv: el, g: el.getContext('2d', { alpha: false }) });
    }
    b.g.setTransform(b.cv.width / w, 0, 0, b.cv.height / h, 0, 0);
    return b;
  }
  function drawBackground(c, w, h, yTop, yBot, ypx, bw, tint, dark) {
    const span = yTop - yBot, g = c.createLinearGradient(0, 0, 0, h);
    const stop = yr => { const p = clamp((yTop - yr) / span, 0, 1); g.addColorStop(p, rgb(mixc(mixc(layerCol('bg', yr, bw), layerCol('deep', yr, bw), .12 + p * .7), tint, dark))); };
    stop(yTop); stop(yBot);
    for (let i = 1; i < NL; i++) {
      const hi = LAYERS[i].from + bw, lo = LAYERS[i].from - bw;
      if (hi < yTop && hi > yBot) stop(hi);
      if (lo < yTop && lo > yBot) stop(lo);
    }
    c.fillStyle = g; c.fillRect(0, 0, w, h);
  }
  const TILE = 256, tiles = [];
  const PATTERN = {
    glass(g) { // nodes and links
      const pts = [[32, 40], [112, 24], [200, 56], [64, 120], [152, 104], [232, 152], [40, 200], [120, 184], [208, 224]];
      g.globalAlpha = .55; g.beginPath();
      for (const [a, b] of [[0, 1], [1, 2], [0, 3], [3, 4], [1, 4], [4, 5], [3, 6], [6, 7], [4, 7], [7, 8], [5, 8]]) { g.moveTo(pts[a][0], pts[a][1]); g.lineTo(pts[b][0], pts[b][1]); }
      g.stroke(); g.globalAlpha = 1;
      for (const [x, y] of pts) { g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); g.globalAlpha = .4; g.beginPath(); g.arc(x, y, 8, 0, 7); g.stroke(); g.globalAlpha = 1; }
    },
    folder(g) { // directory trees
      for (const ox of [24, 152]) {
        g.globalAlpha = .6; g.beginPath(); g.moveTo(ox, 0); g.lineTo(ox, TILE);
        for (let y = 32, k = 0; y < TILE; y += 64, k++) { const ix = ox + 22 + (k % 2) * 18; g.moveTo(ox, y); g.lineTo(ix, y); }
        g.stroke(); g.globalAlpha = 1;
        for (let y = 32, k = 0; y < TILE; y += 64, k++) {
          const ix = ox + 26 + (k % 2) * 18;
          g.beginPath(); g.moveTo(ix, y - 7); g.lineTo(ix + 8, y - 7); g.lineTo(ix + 11, y - 4); g.lineTo(ix + 24, y - 4); g.lineTo(ix + 24, y + 8); g.lineTo(ix, y + 8); g.closePath(); g.stroke();
          g.globalAlpha = .5; g.fillRect(ix + 30, y - 1, 26 + (k % 3) * 10, 2); g.globalAlpha = 1;
        }
      }
    },
    mail(g) { // postmarks: rings and wavy cancel lines
      g.font = '500 15px Inter, sans-serif'; g.textBaseline = 'middle';
      for (const [x, y] of [[50, 58], [178, 186]]) {
        g.beginPath(); g.arc(x, y, 22, 0, 7); g.stroke();
        g.globalAlpha = .55; g.beginPath(); g.arc(x, y, 16, 0, 7); g.stroke();
        for (let k = 0; k < 4; k++) {
          g.beginPath();
          for (let i = 0; i <= 60; i += 4) { const xx = x + 26 + i, yy = y - 12 + k * 8 + Math.sin(i / 5) * 2.5; i ? g.lineTo(xx, yy) : g.moveTo(xx, yy); }
          g.stroke();
        }
        g.fillText('@', x + 96 - (x > 100 ? 220 : 0), y + 64); g.globalAlpha = 1;
      }
    },
    box(g) { // terminal lines and prompts
      g.font = '500 11px Inter, sans-serif'; g.textBaseline = 'middle';
      for (let r = 0; r < 8; r++) {
        const y = 16 + r * 32, x = 14 + (r % 3) * 26;
        g.fillText('>', x, y);
        g.globalAlpha = .55; let cx = x + 14;
        for (let k = 0; k < 4; k++) { const ww = 12 + hash(r * 7 + k) * 34; g.fillRect(cx, y - 1, ww, 2); cx += ww + 8; }
        g.globalAlpha = 1; if (r % 2) g.fillRect(cx, y - 5, 6, 10);
      }
    },
    frame(g) { // punched cards
      for (let cI = 0; cI < 2; cI++) {
        const x = 18, y = 16 + cI * 128;

  /* One frame of the shaft. s = { t, depth, dist, v, yTop, yBot, pAbs, gauge, yearPx, gaugeMin, rail, shakeX, shakeY,

    const out = s.out || 0, got = s.got || 0, layerK = (s.layerFx || 0) * FX, lt = s.light == null ? 100 : s.light;
    const low = clamp((30 - lt) / 30, 0, 1) * (s.sweep > 0 ? 0 : 1), warm = Math.max(low, out);
    // low light sputters
    const sput = low > 0 && !RM && Math.sin(t * 41) * Math.sin(t * 27.3) > .62 - .3 * low ? .55 : 1;
    const fl = (1 - .12 * low + .12 * low * Math.sin(t * 17)) * sput * (1 - .78 * out);
    const amb = s.amb * (1 - .4 * layerK * layerK);

       distance from the lantern (less than the water, so they always read), and the lantern adds its pool back. */
    const dBg = lerp(amb * .8, .94, out), dWall = lerp(amb * .42, .86, out), seen = 1 - dBg * .6;
    const shaken = s.shakeX || s.shakeY;

    if (shaftK > .01) drawShafts(g, w, h, t, shaftK);

    g.globalCompositeOperation = 'lighter';
    const [ea, eb, et] = layerMix(yearP, bw), pk = (.5 + .55 * dBg) * fl * (1 - warm * .5) * (1 - .9 * swE), pr = s.rad * 1.02;
    if (et < .98) { g.globalAlpha = pk * (1 - clamp(et, 0, 1)); spot(g, glow(LAYERS[ea].pool), s.px, s.py, pr); }
    if (et > .02) { g.globalAlpha = pk * clamp(et, 0, 1); spot(g, glow(LAYERS[eb].pool), s.px, s.py, pr); }

    c.globalCompositeOperation = 'lighter';

    if (s.sweep > 0) drawRevealMarks(c, w, h, s.sweep, revTop, false);
    drawWallLight(c, s.rows, s.depth, h, s.px - (s.shakeX || 0), s.py - (s.shakeY || 0), s.rad, fl * (s.blink ? .6 : 1) * (1 - .6 * swE), glow(warm > .5 ? WARM : COOL));

    // screen-wide moments: a new layer brightens the shaft, a hit flashes, low light closes in from the edges

      if (layerK > 0) { c.globalAlpha = .2 * layerK * layerK; c.fillStyle = rgb(acc); c.fillRect(0, 0, w, h); }

      drawHud(c, w, h, s.hud, t, acc, tint);

  const GAUGE_MIN = 126; // the depth ruler, layer seams and finale strata start below the HUD

      bn = { m: banner.m, sub: banner.sub, kick: banner.kick, a: clamp(Math.min(k * 3, (1 - k) * 6), 0, 1), sc: RM ? 1 : 1.12 - .12 * BS.ease(inK), y: H * .62 };

        const top = GAUGE_MIN + SAFE_T - 8, bh = (H - top) / NL;
        bn.compact = true; bn.band = .22; bn.y = top + bh * 3.36; bn.sc *= Math.min(1, bh / 100);

      t: clock, depth, dist: depth, v: vel, yTop: yearAt(depth), yBot: yearAt(depth + H), pAbs,
      gauge: true, yearPx: YEAR_PX, gaugeMin: GAUGE_MIN + SAFE_T, rail: { top: 134 + SAFE_T, bot: H - Math.max(10, SAFE_B) - 104 },
      shakeX: sh > 0 ? rand(-1, 1) * sh * 16 : 0, shakeY: sh > 0 ? rand(-1, 1) * sh * 10 : 0,

      hit: hitFx ? { x: hitFx.x, y: hitFx.y, k: hitFx.t / .6 } : null,
      lowV: running && light < 25 ? (25 - light) / 25 : 0,
      banner: bn,
      hud: {
        show: running || over, top: SAFE_T, m: depthM(), live: running,
        layer: LAYERS[layerNow].name, light, flash: gotFx, score: totalScore(), docs: frags,
        // sits above the shell's mode pill (bottom-centre, ~24px tall, 10px above the safe area)

  // ---------- tutorial demos: small replays drawn with the same helpers, never touching game state ----------
  const DS = .8; // demos show a slightly zoomed-out slice of the real screen
  const smooth = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };

  function demoSparks(fx, fd, t, py) {
    const out = [], rate = 34, n0 = Math.floor(t * rate);

        const rws = [];
        for (let wy = 150; wy < span * DPX - 60; wy += 110) {
          const gc = vw / 2 + Math.sin(wy / 110 * 1.7) * vw * .06, gw = vw * .46;
          rws.push({ y: wy, h: 30, layer: layerIdx(START_YEAR - wy / DPX), blocks: [{ x: 0, w: gc - gw / 2 }, { x: gc + gw / 2, w: vw - gc - gw / 2 }] });
        }
        const sweep = clamp((u - D) / 1.5, 0, 1), e = BS.ease(sweep);
        return {
          yTop: START_YEAR - d / DPX, yBot: START_YEAR - (d + vh) / DPX, pAbs,
          depth: d, dist: d * 3, v: u < D ? clamp((d - fd(t - .02)) / .02, 0, 700) : 0,
          gauge: true, yearPx: DPX, gaugeMin: 104, rail: { top: 108, bot: vh - 20 },
          px: fx(t), py, trail: demoTrail(fx, fd, t, py), sparks: u < D ? demoSparks(fx, fd, t, py) : [], rows: rws, light: 80,
          rad: lightRadius(80, vw, e), amb: (.3 + .64 * pAbs) * (1 - e), sweep,
          parts: sweep > 0 && sweep < .7 ? LAYERS.flatMap((er, i) => demoBurst(vw / 2, py, sweep * 1.5, 9, er.acc, 300, i + 2)) : [],
          banner: sweep > 0 ? { m: BOTTOM_M, sub: 'Lights on, all the way down', a: smooth(sweep * 3), y: vh * .74, band: .3 } : null,
          // the whole dive in five seconds: the gauge counts up in 100 m steps through each layer's name
          hud: { show: true, m: Math.floor(metres(year) / 100) * 100, layer: LAYERS[layerIdx(year)].name, light: 80 },
        };
      }),
    },
  ];

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  if (BS.params.has('debug')) window.__dbg = {
    // depth is the internal scroll offset in px; metres is the depth the player is shown
    state: () => ({ depth, metres: Math.floor(depthM()), layer: layerNow + 1, layerName: LAYERS[layerNow].name, light, frags, hits, running, over, px }),
    steer: x => { tx = x; }, rows: () => rows, items: () => items,
    step: (n = 1) => { for (let i = 0; i < n; i++) update(1 / 60); draw(); },
  };
  resize();
  window.addEventListener('resize', resize);
  nextY = H * .95; lastGapC = W / 2; genUntil(H * 1.6); // scenery behind the start card
  BS.init({
    id: 'deep-dive',
    tagline: 'Context is your AI\u2019s oxygen. How deep can it go before it runs out?',
    tutorial: TUTORIAL,
    onStart: () => start(),
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
