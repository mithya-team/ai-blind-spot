<canvas id="c"></canvas>
<script src="shared/config.js?v=23"></script>

<script>
(() => {
  const cv = document.getElementById('c');
  const GOLD = '#d9b25f', GOLD_L = '#f6dc98', INK = '#0b1733', RED = '#e0795f';
  const G_RGB = '255,224,150', E_RGB = '255,128,92'; // glow tints: gold leaf, ember
  const SERIF = 'Inter, -apple-system, sans-serif'; // one typeface across the set
  const DURATION = +(BS.params.get('t') || 75);
  const TYPES = ['contract', 'email', 'invoice', 'ticket', 'customer'];
  const NAME = { contract: 'Contract', email: 'Email', invoice: 'Invoice', ticket: 'Ticket', customer: 'Customer' };
  const HUD_H = 84;
  const TAU = Math.PI * 2;
  const DPR = Math.min(2, window.devicePixelRatio || 1); // same cap as BS.fit
  const RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const MAX_PARTS = 150;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const backOut = t => { t = clamp(t, 0, 1) - 1; return 1 + 2.70158 * t * t * t + 1.70158 * t * t; };
  const hr = k => { const s = Math.sin(k * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const seeded = s => () => hr(s++ * 1.618 + .37);

  let ctx, W, H, R, bg, hintAt = 0, hudGrad, barGrad, digW = 0;
  let FLOOR = 0, CHIP_Y = 0, BOT = 0, chipHold = 0, hinted = false;
  let LS = 1; // the words grow on tablets, computers and the TV, where the fragments are bigger too // bottom furniture: the shell's strip, the state chip above it, and where play stops
  let nodes = [], voids = [], chain = [], trail = [], art = [], flashes = [], parts = [], pops = [];
  let running = false, over = false, time = 0, clock = 0, score = 0, longest = 0, fulls = 0, connected = 0, lost = 0, warned = 0;
  let ptr = null, snapped = false, redFlash = 0, spawnCd = 0, voidHinted = false;
  // display-only state
  let shown = 0, countHold = 0, scoreBump = 0, worth = null, worthA = 0, worthBump = 0, shake = 0, overT = 0;
  let breaks = [], rays = [], typeBump = {};
  let lite = false, slow = 0; // lite: set if the phone can't hold the frame rate; drops the purely decorative layers
  const par = { x: 0, y: 0 };
  const flecks = Array.from({ length: 26 }, (_, i) => ({ x: hr(i * 3.1 + .5), y: hr(i * 5.7 + 1), z: .25 + .75 * hr(i * 9.3 + 2), ph: hr(i * 2.2 + 3) * TAU }));

  function resize() {
    ({ ctx, w: W, h: H } = BS.fit(cv));
    R = clamp(Math.min(W, H) * 0.056, 18, 27);
    bg = paintBackground(W, H, cv.width, cv.height);
    hudGrad = ctx.createLinearGradient(0, 0, 0, HUD_H + 14);
    hudGrad.addColorStop(0, 'rgba(4,9,24,.94)'); hudGrad.addColorStop(.62, 'rgba(4,9,24,.6)'); hudGrad.addColorStop(1, 'rgba(4,9,24,0)');
    barGrad = ctx.createLinearGradient(18, 0, W - 18, 0);
    barGrad.addColorStop(0, '#b98a31'); barGrad.addColorStop(1, GOLD_L);
    layoutBottom();
    for (const n of nodes) { n.x = clamp(n.x, R, W - R); n.y = clamp(n.y, HUD_H + R, BOT - R - 13 * LS); }
  }
  // The shell's strip (caption, hosts, game, attempt) owns the bottom of the screen. The state chip sits just above
  // it, fragments stay above the chip, and the start hint sits above that.
  function layoutBottom() {
    const strip = document.querySelector('.bs-strip');
    const top = strip ? strip.getBoundingClientRect().top : 0;
    FLOOR = Math.min(H - (BS.SAFE_BOTTOM || 64), top > 0 ? top : H);
    LS = clamp(Math.min(W, H) / 600, 1, 1.5);
    CHIP_Y = FLOOR - 15 * LS; BOT = FLOOR - 28 * LS; hintAt = CHIP_Y;
  }

  // ---------- pre-rendered sprites (glows, medallions, coins, blind-spot layers) ----------
  const cache = new Map();
  const cached = (key, make) => { let s = cache.get(key); if (!s) cache.set(key, s = make()); return s; };
  function sprite(w, h, paint) {
    const s = document.createElement('canvas');
    s.width = Math.ceil(w * DPR); s.height = Math.ceil(h * DPR);
    const x = s.getContext('2d'); x.scale(DPR, DPR);
    paint(x, w, h);
    s.cw = w; s.ch = h;
    return s;
  }
  const glowSprite = rgb => cached('glow' + rgb, () => sprite(64, 64, x => {
    const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, `rgba(${rgb},1)`); g.addColorStop(.22, `rgba(${rgb},.5)`); g.addColorStop(.55, `rgba(${rgb},.12)`); g.addColorStop(1, `rgba(${rgb},0)`);
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  }));
  // Additive soft light. Multiplies the context's current alpha, then restores it.
  function glow(c, x, y, r, a, rgb = G_RGB) {
    if (a <= 0 || r <= 0) return;
    const pa = c.globalAlpha;
    c.globalAlpha = pa * Math.min(1, a); c.globalCompositeOperation = 'lighter';
    c.drawImage(glowSprite(rgb), x - r, y - r, r * 2, r * 2);
    c.globalAlpha = pa; c.globalCompositeOperation = 'source-over';
  }
  function star4(c, x, y, s) {
    const k = s * .2;
    c.beginPath();
    c.moveTo(x, y - s); c.lineTo(x + k, y - k); c.lineTo(x + s, y); c.lineTo(x + k, y + k);
    c.lineTo(x, y + s); c.lineTo(x - k, y + k); c.lineTo(x - s, y); c.lineTo(x - k, y - k);
    c.closePath(); c.fill();
  }
  const sizeKey = r => Math.round(r * 2) / 2;

  // Unlinked fragment: an engraved medallion on dark enamel.
  const medalSprite = (type, r) => cached(`m|${type}|${sizeKey(r)}`, () => {
    const pad = Math.ceil(r * .7), side = 2 * (r + pad), o = side / 2;
    return sprite(side, side, x => {
      let g = x.createRadialGradient(o, o, r * .8, o, o, r + pad);
      g.addColorStop(0, 'rgba(217,178,95,.26)'); g.addColorStop(.45, 'rgba(217,178,95,.07)'); g.addColorStop(1, 'rgba(217,178,95,0)');
      x.fillStyle = g; circle(x, o, o, r + pad); x.fill();
      x.fillStyle = 'rgba(2,5,14,.5)'; circle(x, o, o + 2, r + .5); x.fill();
      g = x.createRadialGradient(o - r * .3, o - r * .45, r * .1, o, o, r);
      g.addColorStop(0, '#1d3270'); g.addColorStop(.55, '#0e1c44'); g.addColorStop(1, '#070f28');
      x.fillStyle = g; circle(x, o, o, r); x.fill();
      const lg = x.createLinearGradient(o - r, o - r, o + r, o + r);
      lg.addColorStop(0, '#fdeebe'); lg.addColorStop(.45, GOLD); lg.addColorStop(1, '#a07c34');
      x.strokeStyle = lg; x.lineWidth = 1.7; circle(x, o, o, r - .85); x.stroke();
      x.strokeStyle = 'rgba(217,178,95,.4)'; x.lineWidth = .8; circle(x, o, o, r * .73); x.stroke();
      x.strokeStyle = '#fdecb8'; glyph(x, type, o, o, r, Math.max(1.3, r * .078));
    });
  });
  // The fine tick ring that turns slowly inside an unlinked medallion.
  const tickSprite = r => cached(`t|${sizeKey(r)}`, () => sprite(2 * r, 2 * r, x => {
    x.translate(r, r); x.lineWidth = .8; x.lineCap = 'butt';
    for (let i = 0; i < 40; i++) {
      const a = i / 40 * TAU, long = i % 5 === 0, r0 = r * (long ? .765 : .8), r1 = r * .885;
      x.strokeStyle = `rgba(232,196,118,${long ? .75 : .42})`;
      x.beginPath(); x.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); x.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); x.stroke();
    }
  }));
  // Linked fragment: a gold-leaf coin with a specular highlight and a beaded edge.
  const coinSprite = (type, r) => cached(`c|${type}|${sizeKey(r)}`, () => {
    const pad = Math.ceil(r * .9), side = 2 * (r + pad), o = side / 2;
    return sprite(side, side, x => {
      let g = x.createRadialGradient(o, o, r * .7, o, o, r + pad);
      g.addColorStop(0, 'rgba(255,208,112,.6)'); g.addColorStop(.4, 'rgba(255,208,112,.18)'); g.addColorStop(1, 'rgba(255,208,112,0)');
      x.fillStyle = g; circle(x, o, o, r + pad); x.fill();
      x.fillStyle = 'rgba(2,5,14,.45)'; circle(x, o, o + 2, r + .5); x.fill();
      g = x.createRadialGradient(o - r * .36, o - r * .44, r * .05, o, o, r * 1.04);
      g.addColorStop(0, '#fffbe8'); g.addColorStop(.2, '#fbe6a6'); g.addColorStop(.58, '#deb65a'); g.addColorStop(.88, '#b98a31'); g.addColorStop(1, '#8a6520');
      x.fillStyle = g; circle(x, o, o, r); x.fill();
      x.save(); circle(x, o, o, r); x.clip();
      x.lineWidth = .6; // leaf grain: faint diagonal hatching
      for (let i = -r * 2; i < r * 2; i += 2.6) {
        x.strokeStyle = `rgba(${hr(i) > .5 ? '255,250,225' : '110,76,16'},${.05 + .07 * hr(i + 9)})`;
        x.beginPath(); x.moveTo(o + i - r, o + r); x.lineTo(o + i + r, o - r); x.stroke();
      }
      g = x.createRadialGradient(o - r * .34, o - r * .5, 0, o - r * .34, o - r * .5, r * .62);
      g.addColorStop(0, 'rgba(255,255,255,.62)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.fillRect(o - r, o - r, r * 2, r * 2);
      x.restore();
      x.strokeStyle = 'rgba(98,66,12,.75)'; x.lineWidth = 1; circle(x, o, o, r - .5); x.stroke();
      x.strokeStyle = 'rgba(255,248,220,.65)'; x.lineWidth = .8; circle(x, o, o, r - 2.2); x.stroke();
      x.fillStyle = 'rgba(112,78,18,.6)';
      for (let i = 0; i < 30; i++) { const a = i / 30 * TAU; circle(x, o + Math.cos(a) * r * .79, o + Math.sin(a) * r * .79, .65); x.fill(); }
      const lw = Math.max(1.35, r * .08);
      x.strokeStyle = 'rgba(255,250,228,.6)'; glyph(x, type, o + .6, o + .9, r * .98, lw);
      x.strokeStyle = INK; glyph(x, type, o, o, r * .98, lw);
    });
  });
  // Small beads for the type row.
  const miniSprite = (type, on) => cached(`i|${type}|${on}`, () => sprite(34, 34, x => {
    const o = 17, r = 10.5;
    if (on) {
      let g = x.createRadialGradient(o, o, r * .6, o, o, 17);
      g.addColorStop(0, 'rgba(255,208,112,.55)'); g.addColorStop(1, 'rgba(255,208,112,0)');
      x.fillStyle = g; circle(x, o, o, 17); x.fill();
      g = x.createRadialGradient(o - 3.6, o - 4.4, .5, o, o, r);
      g.addColorStop(0, '#fffbe8'); g.addColorStop(.3, '#f6dc98'); g.addColorStop(.8, '#cfa247'); g.addColorStop(1, '#9a7426');
      x.fillStyle = g; circle(x, o, o, r); x.fill();
      x.strokeStyle = 'rgba(98,66,12,.7)'; x.lineWidth = .8; circle(x, o, o, r - .4); x.stroke();
      x.strokeStyle = INK; glyph(x, type, o, o, 11.5, 1.25);
    } else {
      x.fillStyle = 'rgba(8,17,42,.94)'; circle(x, o, o, r); x.fill();
      x.strokeStyle = 'rgba(217,178,95,.55)'; x.lineWidth = 1; circle(x, o, o, r - .5); x.stroke();
      x.strokeStyle = 'rgba(246,220,152,.7)'; glyph(x, type, o, o, 11, 1.1);
    }
  }));

  // What each fragment is, in words, under its medallion: a still frame names every piece of content on screen.
  const nameSprite = (type, on, ls = 1) => cached(`nm|${type}|${on}|${ls}`, () => sprite(72 * ls, 16 * ls, x => {
    x.scale(ls, ls);
    x.font = '600 9.5px Inter, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.lineJoin = 'round'; x.strokeStyle = 'rgba(4,9,24,.78)'; x.lineWidth = 3; x.strokeText(NAME[type], 36, 8.5);
    x.fillStyle = on ? '#fff3cf' : 'rgba(246,220,152,.74)'; x.fillText(NAME[type], 36, 8.5);
  }));
  // The words that stay with every blind spot.
  const voidLabel = (ls = 1) => cached('vlab|' + ls, () => sprite(96 * ls, 16 * ls, x => {
    x.scale(ls, ls);
    x.font = '700 8px Inter, sans-serif'; x.textBaseline = 'middle';
    const w = spaced(x, 'BLIND SPOT', 0, 0, 1.3, 'left', true);
    x.lineJoin = 'round'; x.strokeStyle = 'rgba(3,5,14,.92)'; x.lineWidth = 3.5; x.fillStyle = '#ffc2ae';
    let px = 48 - w / 2;
    for (const ch of 'BLIND SPOT') { const cw = x.measureText(ch).width; x.textAlign = 'left'; x.strokeText(ch, px, 8.5); x.fillText(ch, px, 8.5); px += cw + 1.3; }
  }));

  // Blind spot layers, painted once at a reference radius and scaled per blind spot.
  const VR = 64, VS = VR * 3.3;
  const voidCore = () => cached('vcore', () => sprite(VS, VS, x => {
    const o = VS / 2;
    let g = x.createRadialGradient(o, o, VR * .7, o, o, VR * 1.62);
    g.addColorStop(0, 'rgba(1,2,8,.96)'); g.addColorStop(.4, 'rgba(2,3,10,.6)'); g.addColorStop(.7, 'rgba(3,5,14,.22)'); g.addColorStop(1, 'rgba(3,5,14,0)');
    x.fillStyle = g; circle(x, o, o, VR * 1.62); x.fill();
    g = x.createRadialGradient(o, o, 0, o, o, VR);
    g.addColorStop(0, '#000003'); g.addColorStop(.62, '#03020a'); g.addColorStop(1, '#0d0716');
    x.fillStyle = g; circle(x, o, o, VR); x.fill();
    g = x.createRadialGradient(o, o, VR * .86, o, o, VR * 1.14);
    g.addColorStop(0, 'rgba(226,96,64,0)'); g.addColorStop(.5, 'rgba(238,114,80,.4)'); g.addColorStop(1, 'rgba(226,96,64,0)');
    x.fillStyle = g; circle(x, o, o, VR * 1.14); x.fill();
  }));
  const voidArms = () => cached('varms', () => sprite(VR * 2, VR * 2, x => {
    x.translate(VR, VR); x.lineCap = 'round';
    const g = x.createRadialGradient(0, 0, VR * .06, 0, 0, VR * .92);
    g.addColorStop(0, 'rgba(150,140,240,0)'); g.addColorStop(.45, 'rgba(142,136,236,.3)'); g.addColorStop(1, 'rgba(172,152,246,.52)');
    x.strokeStyle = g;
    for (const [lw, a] of [[3.4, .3], [1.1, 1]]) {
      x.lineWidth = lw; x.globalAlpha = a;
      for (let arm = 0; arm < 7; arm++) {
        x.beginPath();
        for (let s = 0; s <= 44; s++) {
          const u = s / 44, r = VR * (.07 + .83 * u), t = arm / 7 * TAU + u * 3.9;
          s ? x.lineTo(Math.cos(t) * r, Math.sin(t) * r) : x.moveTo(Math.cos(t) * r, Math.sin(t) * r);
        }
        x.stroke();
      }
    }
  }));
  const voidRings = () => cached('vrings', () => sprite(VR * 2, VR * 2, x => {
    x.translate(VR, VR); x.lineCap = 'round';
    for (const [rad, n, rgb, a, lw] of [[.85, 5, '196,176,250', .3, 1.1], [.63, 4, '170,150,245', .4, 1.2], [.4, 3, '170,150,245', .34, 1.1]]) {
      x.strokeStyle = `rgba(${rgb},${a})`; x.lineWidth = lw;
      for (let j = 0; j < n; j++) { const a0 = j / n * TAU + rad * 5; x.beginPath(); x.arc(0, 0, VR * rad, a0, a0 + TAU / n * .6); x.stroke(); }
    }
  }));
  const voidWisps = () => cached('vwisps', () => sprite(VS, VS, x => {
    x.translate(VS / 2, VS / 2); x.lineCap = 'round';
    for (let w = 0; w < 9; w++) {
      const a0 = w / 9 * TAU + hr(w) * .4, reach = 1.28 + .3 * hr(w + 4);
      for (let s = 0; s < 14; s++) {
        const u0 = s / 14, u1 = (s + 1) / 14, r0 = VR * (.97 + (reach - .97) * u0), r1 = VR * (.97 + (reach - .97) * u1), t0 = a0 + u0 * 1.25, t1 = a0 + u1 * 1.25;
        x.strokeStyle = `rgba(2,3,10,${.6 * (1 - u0)})`; x.lineWidth = 10 * (1 - u0) + 1;
        x.beginPath(); x.moveTo(Math.cos(t0) * r0, Math.sin(t0) * r0); x.lineTo(Math.cos(t1) * r1, Math.sin(t1) * r1); x.stroke();
        if (w % 3 === 0) {
          x.strokeStyle = `rgba(236,122,90,${.34 * (1 - u0)})`; x.lineWidth = 1;
          x.beginPath(); x.moveTo(Math.cos(t0) * r0, Math.sin(t0) * r0); x.lineTo(Math.cos(t1) * r1, Math.sin(t1) * r1); x.stroke();
        }
      }
    }
  }));
  const sheenSprite = () => cached('sheen', () => sprite(96, 2, x => {
    const g = x.createLinearGradient(0, 0, 96, 0);
    g.addColorStop(0, 'rgba(255,236,190,0)'); g.addColorStop(.5, 'rgba(255,236,190,.075)'); g.addColorStop(1, 'rgba(255,236,190,0)');
    x.fillStyle = g; x.fillRect(0, 0, 96, 2);
  }));
  const dimSprite = () => cached('dim', () => sprite(64, 64, x => {
    const g = x.createRadialGradient(32, 32, 8, 32, 32, 46);
    g.addColorStop(0, 'rgba(120,24,14,.04)'); g.addColorStop(.5, 'rgba(150,34,22,.26)'); g.addColorStop(1, 'rgba(196,56,38,.9)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  }));

  // ---------- background ----------
  // A guilloche rosette: bands of interlaced sine waves wrapped round a circle, as on a banknote.
  function rosette(x, cx, cy, rad, lobes, a) {
    x.lineWidth = .6;
    for (const [ri, ro, n, lines] of [[.6, 1, lobes, 8], [.34, .58, Math.round(lobes * .67), 6], [.12, .32, Math.round(lobes * .42), 5]]) {
      const mid = (ri + ro) / 2 * rad, amp = (ro - ri) / 2 * rad, steps = n * 28;
      for (let j = 0; j < lines; j++) {
        x.strokeStyle = `rgba(217,178,95,${a * (j % 2 ? 1 : .7)})`;
        x.beginPath();
        for (let s = 0; s <= steps; s++) {
          const t = s / steps * TAU, r = mid + amp * Math.sin(n * t + j / lines * TAU);
          s ? x.lineTo(cx + Math.cos(t) * r, cy + Math.sin(t) * r) : x.moveTo(cx + Math.cos(t) * r, cy + Math.sin(t) * r);
        }
        x.stroke();
      }
    }
    x.strokeStyle = `rgba(217,178,95,${a * 1.5})`;
    circle(x, cx, cy, rad * 1.035); x.stroke(); circle(x, cx, cy, rad * .59); x.stroke(); circle(x, cx, cy, rad * .33); x.stroke();
  }
  // Navy "engraved paper": wash, guilloche rosettes, star-chart rings, fixed stars, grain and a vignette. Painted once per size.
  function paintBackground(w, h, pw, ph) {
    const g = document.createElement('canvas');
    g.width = pw; g.height = ph;
    const x = g.getContext('2d');
    x.scale(pw / w, ph / h);
    const m = Math.min(w, h), M = Math.max(w, h), cx = w * .5, cy = h * .47;
    let grd = x.createRadialGradient(w * .5, h * .34, 0, w * .5, h * .52, M * .86);

  // ---------- spawning ----------
  function pickType() {
    const counts = TYPES.map(t => nodes.filter(n => n.type === t).length);
    const min = Math.min(...counts);
    if (Math.random() < .65) {
      const opts = TYPES.filter((t, i) => counts[i] === min);
      return opts[Math.floor(Math.random() * opts.length)];
    }
    return TYPES[Math.floor(Math.random() * TYPES.length)];
  }
  function spawnNode(delay = 0) {
    for (let i = 0; i < 40; i++) {
      const x = rand(R + 14, W - R - 14), y = rand(HUD_H + R + 6, BOT - R - 20 * LS);
      if (nodes.some(n => Math.hypot(n.x - x, n.y - y) < R * 3.1)) continue;
      if (voids.some(v => Math.hypot(v.x - x, v.y - y) < v.r + R * 2)) continue;
      if (ptr && Math.hypot(ptr.x - x, ptr.y - y) < R * 2.5) continue;
      const a = rand(0, Math.PI * 2), s = rand(5, 14);

    const r = clamp(Math.min(W, H) * rand(.085, .12), 30, 58);

      if (ptr && Math.hypot(ptr.x - x, ptr.y - y) < r + 150) continue;
      if (voids.some(v => Math.hypot(v.x - x, v.y - y) < v.r + r + 40)) continue;
      const a = rand(0, Math.PI * 2), s = rand(16, 30);

  // ---------- input ----------
  const pos = e => ({ x: e.clientX, y: e.clientY });

  // ---------- game flow ----------
  function start() {

  // One plain-English line for the end screen, built from this round's stats.

      return 'No fragments were connected this round. On their own, fragments tell your agent nothing.';
    }
    const base = `You connected ${pl(s.connected, 'fragment')} into one view for your agent` + (s.pictures ? ` and built ${pl(s.pictures, 'full picture')}` : '');

    return `${base}, but ${pl(s.lost, 'thread was', 'threads were')} lost to blind spots.`;
  }
  function end() {

    const stats = { connected, longest, pictures: fulls, lost };
    const prev = BS.best('golden-thread');
    setTimeout(() => BS.finish({

  function update(dt) {

      if (left <= 5 && left >= 1 && left !== warned) { warned = left; BS.sfx('warn'); }
      if (time >= DURATION) end();
    }
    const p = running ? time / DURATION : 0;
    const nodeTarget = 11 + Math.floor(p * 5);
    const voidTarget = running ? (time < 5 ? 0 : 1 + Math.floor(p * 3.2)) : 0;
    spawnCd -= dt;
    if (!over && nodes.length < nodeTarget && spawnCd <= 0) { spawnNode(); spawnCd = .12; }
    if (voids.length < voidTarget) spawnVoid();

      if (n.y < HUD_H + R) { n.y = HUD_H + R; n.vy = Math.abs(n.vy); }
      if (n.y > BOT - R - 13 * LS) { n.y = BOT - R - 13 * LS; n.vy = -Math.abs(n.vy); }

      if (v.x > W - v.r) { v.x = W - v.r; v.vx = -Math.abs(v.vx); }

    for (const q of rays) q.life -= dt;

  // ---------- drawing (every helper takes the context, so the tutorial demos reuse them) ----------
  function polyline(c, pts) {

    let text = st.text(3), tw = c.measureText(text).width;
    if (17 + ww + 9 + tw + 11 > maxW) { text = st.text(2); tw = c.measureText(text).width; }
    const w = 17 + ww + (text ? 9 + tw : 0) + 11, x = -w / 2, hh = 10.5;
    c.translate(cx, y); c.scale(ls, ls); cx = 0; y = 0;
    c.globalAlpha = a;
    if (full) glow(c, cx, y, w * .42, .28);
    c.fillStyle = 'rgba(4,9,24,.66)'; BS.rr(c, x, y - hh, w, hh * 2, hh); c.fill();
    c.strokeStyle = full ? 'rgba(255,243,207,.85)' : on ? 'rgba(246,220,152,.5)' : 'rgba(255,160,130,.36)'; c.lineWidth = 1;
    BS.rr(c, x + .5, y - hh + .5, w - 1, hh * 2 - 1, hh); c.stroke();
    c.fillStyle = on ? GOLD_L : '#ff9a80';
    if (on) circle(c, x + 10, y, 2.6); else { c.beginPath(); c.arc(x + 10, y, 2.4, 0, TAU); }
    if (on) c.fill(); else { c.strokeStyle = '#ff9a80'; c.lineWidth = 1.3; c.stroke(); }
    c.font = '700 8.5px Inter, sans-serif'; c.fillStyle = on ? GOLD_L : '#ffb39e';
    spaced(c, st.word, x + 17, y + .5, 1.6, 'left');
    if (text) { c.font = '600 11px Inter, sans-serif'; c.textAlign = 'left'; c.fillStyle = on ? '#fff3cf' : 'rgba(238,241,248,.72)'; c.fillText(text, x + 17 + ww + 9, y + .5); }
    c.restore();
  }
  function chipState() {
    if (over) return connected ? { word: 'CONNECTED', text: () => `${BS.pl(connected, 'fragment')}, one view`, tone: 'on' } : { word: 'DISCONNECTED', text: () => 'no connected view', tone: 'off' };
    if (chain.length >= 2) return { word: 'CONNECTED', text: k => chainWords(chain, k), tone: chain.full ? 'full' : 'on' };
    if (chain.length === 1) return { word: 'CONNECTING', text: k => chainWords(chain, k), tone: 'on' };
    if (chipHold > 0) return { word: 'CONNECTED', text: () => 'end to end', tone: 'full' };
    const loose = nodes.filter(n => !n.linked && n.age > 0).length;
    return { word: 'DISCONNECTED', text: () => BS.pl(loose, 'loose fragment'), tone: 'off' };
  }
  function drawHud() {
    ctx.fillStyle = hudGrad; ctx.fillRect(0, 0, W, HUD_H + 14);
    if (!running && !over) return;
    const ha = over ? clamp(1 - (overT - .85) / .5, 0, 1) : 1; // fades once the end card is up
    if (ha <= 0) return;
    ctx.globalAlpha = ha;
    const left = Math.max(0, Math.ceil(DURATION - time));
    const urgent = running && left <= 10;
    const since = 1 - ((((DURATION - time) % 1) + 1) % 1);
    const beat = urgent && !RM ? Math.max(0, 1 - since * 2.6) : 0;
    ctx.textBaseline = 'alphabetic';

    // labels
    ctx.font = '600 9px Inter, sans-serif'; ctx.fillStyle = 'rgba(246,220,152,.58)';
    spaced(ctx, 'SCORE', 18, 19, 1.9, 'left');
    ctx.fillStyle = urgent ? 'rgba(255,170,140,.85)' : 'rgba(246,220,152,.58)';
    spaced(ctx, 'TIME', W - 18, 19, 1.9, 'right');

    // score: counts up as the gold dust arrives
    const txt = BS.fmt(Math.round(shown)), room = W / 2 - 68 - 18 - 8;
    ctx.font = `700 32px ${SERIF}`;
    const fit = Math.min(1, room / ctx.measureText(txt).width), sb = RM ? 0 : scoreBump;
    ctx.save(); ctx.translate(18, 47); ctx.scale(fit * (1 + .1 * sb), fit * (1 + .1 * sb));
    if (scoreBump > 0) glow(ctx, ctx.measureText(txt).width / 2, -10, 34, scoreBump * .5);
    ctx.textAlign = 'left'; ctx.fillStyle = scoreBump > 0 ? '#fff3cf' : GOLD_L; ctx.fillText(txt, 0, 0);
    ctx.restore();

    // timer: the colon and the tens digit hold still while the figures change; it beats once a second in the last ten
    if (!digW) digW = Math.max(...'0123456789'.split('').map(ch => ctx.measureText(ch).width));
    const mm = String(Math.floor(left / 60)), ss = String(left % 60).padStart(2, '0');
    ctx.save(); ctx.translate(W - 18, 47); ctx.scale(1 + .13 * beat, 1 + .13 * beat);
    if (urgent) glow(ctx, -digW * 1.5, -10, 36, .18 + .4 * beat, E_RGB);
    ctx.fillStyle = urgent ? '#ffa184' : GOLD_L;
    const sx = -digW * 1.9;
    ctx.textAlign = 'left'; ctx.fillText(ss, sx, 0);
    ctx.textAlign = 'center'; ctx.fillText(':', sx - 5, -1.5);
    ctx.textAlign = 'right'; ctx.fillText(mm, sx - 10, 0);
    ctx.restore();

    // timer hairline with quarter ticks and a small jewel at the leading end
    const x0 = 18, x1 = W - 18, hy = 58, xe = x0 + (x1 - x0) * clamp(1 - time / DURATION, 0, 1);
    ctx.fillStyle = 'rgba(217,178,95,.2)'; ctx.fillRect(x0, hy, x1 - x0, 1);
    ctx.fillStyle = 'rgba(217,178,95,.34)';
    for (let i = 0; i <= 4; i++) ctx.fillRect(Math.round(x0 + (x1 - x0) * i / 4) - .5, hy - 2, 1, 5);
    ctx.fillStyle = urgent ? '#ff9a80' : barGrad; ctx.fillRect(x0, hy - .5, xe - x0, 2);
    if (running) {
      glow(ctx, xe, hy + .5, 9 + 4 * beat, .75, urgent ? E_RGB : G_RGB);
      ctx.save(); ctx.translate(xe, hy + .5); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = urgent ? '#ffd0bd' : '#fff3cf'; ctx.fillRect(-2.4, -2.4, 4.8, 4.8);
      ctx.restore();
    }

    drawTypeRow(ctx, W / 2, 34, new Set(chain.map(c => c.type)), typeBump);

    // what the thread in hand is worth
    if (worth && worthA > 0) {
      const val = '+' + BS.fmt(10 * worth.n * worth.n * (worth.full ? 2 : 1));
      const lab = worth.full ? 'FULL PICTURE ×2' : `THREAD OF ${worth.n}`;
      ctx.globalAlpha = worthA * ha;
      ctx.font = '600 9px Inter, sans-serif';
      const lw = spaced(ctx, lab, 0, 0, 1.7, 'left', true);
      ctx.font = `700 21px ${SERIF}`;
      const vw = ctx.measureText(val).width, sx = W / 2 - (lw + 9 + vw) / 2, wb = RM ? 0 : worthBump;
      ctx.font = '600 9px Inter, sans-serif';
      ctx.fillStyle = worth.full ? GOLD_L : 'rgba(246,220,152,.68)';
      spaced(ctx, lab, sx, 77, 1.7, 'left');
      ctx.save(); ctx.translate(sx + lw + 9 + vw / 2, 80); ctx.scale(1 + .22 * wb, 1 + .22 * wb);
      if (worthBump > 0 || worth.full) glow(ctx, 0, -6, 24, worth.full ? .3 + .3 * worthBump : worthBump * .4);
      ctx.font = `700 21px ${SERIF}`; ctx.textAlign = 'center'; ctx.fillStyle = worth.full ? '#fff3cf' : GOLD_L;
      ctx.fillText(val, 0, 0);
      ctx.restore();
      ctx.globalAlpha = ha;
    }

    // The start hint has the chip's row for the first five seconds, or until the first fragment is touched.
    const hint = running && time < 5 && !chain.length && !hinted ? Math.min(1, (5 - time) / 1.2) : 0;
    if (running && chain.length) hinted = true;
    if (hint > 0) {
      ctx.globalAlpha = hint * ha;
      ctx.fillStyle = 'rgba(246,220,152,.86)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `500 ${W < 380 ? 12 : Math.round(13 * LS)}px Inter, sans-serif`;
      ctx.fillText('Drag through fragments · lift to bank · collect all five', W / 2, hintAt);
      ctx.textBaseline = 'alphabetic';
    }
    drawChip(ctx, W / 2, CHIP_Y, W - 20, chipState(), ha * (1 - hint), LS);
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.drawImage(bg, 0, 0, W, H);
    drawAmbient();
    if (over) drawChart(ctx, art, .16 + .6 * BS.ease(overT / .8), true, clock);
    else { // older threads recede a little; the latest few stay brighter
      const cut = Math.max(0, art.length - 4);
      drawChart(ctx, art.slice(0, cut), .11, false, clock);
      drawChart(ctx, art.slice(cut), .2, false, clock);
    }
    for (const f of flashes) drawFlash(ctx, f.pts, f.life / .9);
    ctx.save();
    if (shake > 0) { const s = (shake / .3) ** 2 * 5; ctx.translate(Math.sin(clock * 91) * s, Math.cos(clock * 77) * s); }
    voids.forEach(v => drawVoid(ctx, v, clock, LS));
    if (chain.length || (ptr && !snapped)) drawThread(ctx, chain, trail, ptr, clock);
    const fade = over ? 1 - overT / .45 : 1;
    if (fade > 0) nodes.forEach(n => drawNode(ctx, n, R, clock, fade, LS));
    for (const b of breaks) drawShards(ctx, b.list, clock - b.t0);
    ctx.restore();
    // particles: every glow in one additive pass, then the cores
    ctx.globalCompositeOperation = 'lighter';
    for (const q of parts) {
      const a = q.dust ? .8 : clamp(q.life / q.max, 0, 1) * .55, r = q.size * (q.dust ? 4.6 : 4.2);
      ctx.globalAlpha = a; ctx.drawImage(glowSprite(q.color === RED ? E_RGB : G_RGB), q.x - r, q.y - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,232,170,.38)'; ctx.lineWidth = 1;
    for (const q of parts) {
      if (q.dust) {
        ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.moveTo(q.px, q.py); ctx.lineTo(q.x, q.y); ctx.stroke();
        ctx.fillStyle = '#fff6d8'; circle(ctx, q.x, q.y, q.size * .8); ctx.fill();
      } else {
        ctx.globalAlpha = clamp(q.life / q.max, 0, 1); ctx.fillStyle = q.color; circle(ctx, q.x, q.y, q.size); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    for (const q of rays) drawRays(ctx, q.x, q.y, 1 - q.life / q.max);
    for (const q of pops) drawPop(ctx, q, W, HUD_H + 16);
    drawHud();
    if (redFlash > 0) drawSnapFlash(ctx, W, H, redFlash / .35);
  }

  // ---------- tutorial demos ----------
  // Each demo is a pure function of time: it builds its own fragments and effects every frame
  // with the drawing helpers above, and never reads or writes the live game state.
  const DR = 19; // fragment radius in the demo frame (the game's minimum size)
  const DRAG = -Math.log(.96) * 60; // the game damps particle speed by .96 per frame at 60 fps
  const sstep = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
  const dn = (x, y, type, ph = 0) => ({ x, y, type, age: 9, linked: false, pulse: 0, ph });
  let demoBgCache = null;
  function demoBg(c, w, h) {
    const d = (c.getTransform && c.getTransform().a) || 1, key = `${w}x${h}@${d}`;
    if (!demoBgCache || demoBgCache.key !== key) demoBgCache = { key, img: paintBackground(w, h, Math.round(w * d), Math.round(h * d)) };
    c.drawImage(demoBgCache.img, 0, 0, w, h);
  }
  // Fade in at the start of each loop and out at the end, so the restart doesn't jump.
  function demoFade(c, w, h, t, L) {
    const a = clamp(Math.max(1 - t / .3, 1 - (L - t) / .35), 0, 1);
    if (a > 0) { c.fillStyle = `rgba(8,19,41,${a})`; c.fillRect(0, 0, w, h); }
  }
  // Finger path: keys = [[time, x, y], ...], eased between keys.
  function track(keys, t) {
    if (t <= keys[0][0]) return { x: keys[0][1], y: keys[0][2] };
    for (let i = 1; i < keys.length; i++) {
      const [t1, x1, y1] = keys[i], [t0, x0, y0] = keys[i - 1];
      if (t <= t1) { const k = sstep((t - t0) / ((t1 - t0) || 1)); return { x: x0 + (x1 - x0) * k, y: y0 + (y1 - y0) * k }; }
    }
    const l = keys[keys.length - 1]; return { x: l[1], y: l[2] };
  }
  // Mark the fragments linked by time t (link times in tl) and give each its pulse ring.
  function linkUpTo(path, tl, t) {
    const on = [];
    path.forEach((n, i) => { if (t >= tl[i]) { n.linked = true; n.pulse = Math.max(0, 1 - (t - tl[i]) * 2.2); on.push(n); } });
    return on;
  }
  // Same particles as burst(), seeded so every frame agrees.
  function burstSpec(x, y, n, color, sp, seed) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const k = seed * 31 + i * 7, a = hr(k) * Math.PI * 2, s = (.3 + .7 * hr(k + 1)) * sp;
      out.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .4 + .4 * hr(k + 2), max: .8, size: 1 + 1.4 * hr(k + 3), color, g: 0 });
    }
    return out;
  }
  // Where a game particle would be after t seconds of the game's damping and gravity.
  function demoParts(c, list, t) {
    if (t < 0) return;
    const f = (1 - Math.exp(-DRAG * t)) / DRAG;
    for (const q of list) {
      if (t >= q.life) continue;
      const gk = q.g / DRAG;
      drawParticle(c, q.x + q.vx * f, q.y + gk * t + (q.vy - gk) * f, q.size, q.color, clamp((q.life - t) / q.max, 0, 1));
    }
  }
  function demoPop(c, w, x, y, text, size, color, t, life = 1.2, it = false) {
    if (t < 0 || t >= life) return;
    drawPop(c, { x, y: y - 26 * t, text, size, color, life: life - t, max: life, it }, w, 14);
  }
  // Bank effects from time tb: flash along the thread, a burst at every fragment, faint art left behind.
  function demoBank(c, path, t, tb) {
    if (t < tb) return;
    drawArt(c, path, .2, false);
    const a = 1 - (t - tb) / .9;
    if (a > 0) drawFlash(c, path, a);
    path.forEach((n, i) => demoParts(c, burstSpec(n.x, n.y, 6, GOLD_L, 140, 20 + i), t - tb));
  }
  const bob = (list, T) => list.forEach((n, i) => { n.x += Math.sin(T * .8 + i * 1.7) * 3; n.y += Math.cos(T * .6 + i * 2.3) * 3; });

  const tutorial = [
    {
      title: 'Touch a fragment',
      text: 'Put one finger on any fragment. Each is a piece of unstructured content: a contract, email, invoice, ticket or customer record.',
      demo(c, w, h, T) {
        const L = 3.6, t = T % L;
        demoBg(c, w, h);
        const n = dn(w * .5, h * .55, 'contract', 3);
        const others = [dn(w * .2, h * .28, 'email', 1), dn(w * .8, h * .25, 'invoice', 2), dn(w * .2, h * .8, 'ticket', 4), dn(w * .8, h * .78, 'customer', 5)];
        bob(others, T);
        const tDown = 1, tUp = 2.6;
        const hand = track([[0, w * .74, h + 24], [tDown, n.x, n.y], [tUp, n.x, n.y], [L - .2, w * .86, h + 24]], t);
        const down = t >= tDown && t < tUp;
        if (down) { linkUpTo([n], [tDown], t); drawThread(c, [n], [n], hand, T); }
        [...others, n].forEach(m => drawNode(c, m, DR, T));
        demoParts(c, burstSpec(n.x, n.y, 7, GOLD_L, 90, 1), t - tDown);
        BS.drawHand(c, hand.x, hand.y, down);
        demoFade(c, w, h, t, L);
      },
    },
    {
      title: 'Drag through more',
      text: 'Without lifting, slide through other fragments to link them into one golden thread. Connected data tells your agent what is happening.',
      demo(c, w, h, T) {
        const L = 4.8, t = T % L;
        demoBg(c, w, h);
        const path = [dn(w * .15, h * .66, 'contract'), dn(w * .38, h * .32, 'email', 1), dn(w * .62, h * .64, 'invoice', 2), dn(w * .85, h * .3, 'ticket', 3)];
        const others = [dn(w * .86, h * .78, 'customer', 4), dn(w * .14, h * .26, 'customer', 5)];
        bob(others, T);
        const tl = [.8, 1.6, 2.4, 3.2];
        const hand = track([[0, w * .05, h + 24], ...path.map((n, i) => [tl[i], n.x, n.y]), [L, path[3].x, path[3].y]], t);
        const down = t >= tl[0];
        const on = linkUpTo(path, tl, t);
        if (down) drawThread(c, on, [on[on.length - 1]], hand, T);
        drawChip(c, w / 2, 16, w - 16, on.length > 1 ? { word: 'CONNECTED', text: k => chainWords(on, k), tone: 'on' } : on.length ? { word: 'CONNECTING', text: k => chainWords(on, k), tone: 'on' } : { word: 'DISCONNECTED', text: () => '6 loose fragments', tone: 'off' });
        [...others, ...path].forEach(m => drawNode(c, m, DR, T));
        path.forEach((n, i) => demoParts(c, burstSpec(n.x, n.y, 7, GOLD_L, 90, i + 1), t - tl[i]));
        BS.drawHand(c, hand.x, hand.y, down);
        demoFade(c, w, h, t, L);
      },
    },
    {
      title: 'Lift to bank it',
      text: 'Lift your finger to bank the thread. Longer threads score far more: 4 fragments is 160 points, 8 is 640.',
      demo(c, w, h, T) {
        const L = 4.6, t = T % L;
        demoBg(c, w, h);
        const path = [dn(w * .14, h * .42, 'customer'), dn(w * .36, h * .72, 'email', 1), dn(w * .6, h * .42, 'contract', 2), dn(w * .82, h * .7, 'invoice', 3)];
        const others = [dn(w * .86, h * .2, 'ticket', 4)];
        bob(others, T);
        const tl = [-1, -1, -1, 1.1], tUp = 1.8;
        const hand = track([[.3, path[2].x, path[2].y], [tl[3], path[3].x, path[3].y], [tUp, path[3].x, path[3].y], [tUp + .9, w * .95, h + 24]], t);
        const down = t < tUp;
        if (down) { const on = linkUpTo(path, tl, t); drawThread(c, on, [on[on.length - 1]], hand, T); }
        demoBank(c, path, t, tUp);
        // the board refills after a bank
        const fresh = [dn(w * .4, h * .3, 'ticket', 6), dn(w * .58, h * .8, 'email', 7)];
        fresh.forEach(n => { n.age = t - (tUp + 1.2); });
        [...others, ...fresh, ...(down ? path : [])].forEach(m => drawNode(c, m, DR, T));
        demoParts(c, burstSpec(path[3].x, path[3].y, 7, GOLD_L, 90, 4), t - tl[3]);
        demoPop(c, w, path[3].x, path[3].y - DR - 12, '+' + BS.fmt(10 * 4 * 4), 24, GOLD_L, t - tUp);
        BS.drawHand(c, hand.x, hand.y, down);
        demoFade(c, w, h, t, L);
      },
    },
    {
      title: 'Keep clear of blind spots',
      text: 'Dark blind spots drift in: information your agent can\u2019t reach. If your finger touches one, the thread breaks and scores nothing.',
      demo(c, w, h, T) {
        const L = 5, t = T % L;
        demoBg(c, w, h);
        const A = dn(w * .14, h * .72, 'email'), B = dn(w * .36, h * .4, 'customer', 1);
        const others = [dn(w * .88, h * .78, 'invoice', 2), dn(w * .86, h * .18, 'contract', 3)];
        bob(others, T);
        const tV = .3, V = { x: w * .68, y: h * .52, r: Math.min(36, h * .16), age: t - tV, rot: T * .7 };
        const tA = .7, tB = 1.4, tIn = 2.6, tUp = 3.3;
        const keys = [[0, w * .05, h + 24], [tA, A.x, A.y], [tB, B.x, B.y], [tIn, V.x + 6, V.y + 4], [tUp, V.x + 6, V.y + 4], [tUp + .9, w * .9, h + 24]];
        const hand = track(keys, t);
        // the first moment the finger meets the formed blind spot, using the game's own test
        let ts = Infinity;
        for (let s = tB; s <= tIn + .01; s += .02) {
          const p = track(keys, s);
          if (s - tV > 1.2 && Math.hypot(p.x - V.x, p.y - V.y) < V.r * .9) { ts = s; break; }
        }
        const broke = t >= ts, down = t >= tA && t < tUp;
        if (V.age > 0) drawVoid(c, V, T);
        if (down && !broke) { const on = linkUpTo([A, B], [tA, tB], t); drawThread(c, on, [on[on.length - 1]], hand, T); }
        if (broke) { A.shock = B.shock = Math.max(0, 1 - (t - ts) * 2.4); }
        [...others, A, B].forEach(m => drawNode(c, m, DR, T));
        demoParts(c, burstSpec(A.x, A.y, 7, GOLD_L, 90, 1), t - tA);
        demoParts(c, burstSpec(B.x, B.y, 7, GOLD_L, 90, 2), t - tB);
        demoPop(c, w, V.x, V.y - V.r - 18, 'Blind spot · keep clear', 15, '#ffb39e', t - tV, 2.2);
        if (broke) {
          const sp = track(keys, ts), pieces = resample([A, B, sp], 14, 44);
          drawShards(c, shardSpec(pieces, seeded(11)), t - ts);
          demoParts(c, emberSpec(pieces, seeded(7)), t - ts);
          demoPop(c, w, sp.x, sp.y - 34, 'Lost in a blind spot', 17, '#ff9a80', t - ts);
        }
        BS.drawHand(c, hand.x, hand.y, down);
        if (broke) drawSnapFlash(c, w, h, Math.max(0, .35 - (t - ts)) / .35);
        demoFade(c, w, h, t, L);
      },
    },
    {
      title: 'Get the full picture',
      text: `Link all five kinds in one thread for the full picture, connected end to end, and double points. Rounds last ${DURATION} seconds.`,
      demo(c, w, h, T) {
        const L = 6.2, t = T % L;
        demoBg(c, w, h);
        const ys = [.64, .42, .66, .44, .68];
        const path = TYPES.map((ty, i) => dn(w * (.12 + i * .19), h * ys[i], ty, i));
        const last = path[4], tl = [.6, 1.2, 1.8, 2.4, 3], tUp = 4.1;
        const hand = track([[0, w * .02, h + 24], ...path.map((n, i) => [tl[i], n.x, n.y]), [tUp, last.x, last.y], [tUp + .9, w * .98, h + 24]], t);
        const down = t >= tl[0] && t < tUp;
        const on = down ? linkUpTo(path, tl, t) : [];
        const bump = {};
        on.forEach((n, i) => { bump[n.type] = Math.max(0, 1 - (t - tl[i]) * 3.5); });
        drawTypeRow(c, w / 2, 30, new Set(on.map(n => n.type)), bump);
        if (down) drawThread(c, on, [on[on.length - 1]], hand, T);
        demoBank(c, path, t, tUp);
        drawChip(c, w / 2, h - 15, w - 16, t >= tUp ? { word: 'CONNECTED', text: () => 'end to end', tone: 'full' }
          : on.length > 1 ? { word: 'CONNECTED', text: k => chainWords(on, k), tone: on.length === 5 ? 'full' : 'on' }
          : on.length ? { word: 'CONNECTING', text: k => chainWords(on, k), tone: 'on' } : { word: 'DISCONNECTED', text: () => '5 loose fragments', tone: 'off' });
        if (t < tUp) path.forEach(m => drawNode(c, m, DR, T));
        path.forEach((n, i) => demoParts(c, burstSpec(n.x, n.y, 7, GOLD_L, 90, i + 1), t - tl[i]));
        drawRays(c, last.x, last.y, (t - tUp) / 1.1);
        demoPop(c, w, last.x, last.y - DR - 16, 'Full picture', 18, GOLD_L, t - tl[4]);
        demoPop(c, w, last.x, last.y - DR - 12, '+' + BS.fmt(10 * 5 * 5 * 2), 24, GOLD_L, t - tUp);
        demoPop(c, w, last.x, last.y - DR - 44, 'Connected, end to end', 17, '#fff3cf', t - tUp, 1.6, true);
        BS.drawHand(c, hand.x, hand.y, down);
        demoFade(c, w, h, t, L);
      },
    },
  ];

  let last = performance.now();
  function frame(t) {
    const raw = t - last, dt = Math.min(.05, raw / 1000); last = t;
    // About 1.5 s of slow frames (ignoring pauses) switches to the lighter look for the rest of the visit.
    if (!lite && raw < 100) { slow = raw > 22 ? slow + raw : Math.max(0, slow - raw * .5); if (slow > 1500) lite = true; }
    if (!BS.paused) update(dt); // frozen behind the pause card
    draw();
    requestAnimationFrame(frame);
  }

  if (BS.params.has('debug')) window.__dbg = {
    nodes: () => nodes, voids: () => voids, score: () => score,
    stats: () => ({ connected, longest, pictures: fulls, lost }),
    step: (n = 1) => { for (let i = 0; i < n; i++) update(1 / 60); draw(); },
  };
  resize();
  window.addEventListener('resize', resize);
  // Text is drawn on the canvas, so re-measure the figures once the web fonts arrive.
  if (document.fonts) {
    if (document.fonts.load) for (const f of [`700 32px ${SERIF}`, `700 19px ${SERIF}`, '600 9px Inter', '500 13px Inter', '600 9.5px Inter', '700 8.5px Inter', '600 11px Inter']) document.fonts.load(f).catch(() => {});
    // the word sprites were painted in whatever font was there at the time: repaint them in Inter
    const refont = () => { digW = 0; for (const k of [...cache.keys()]) if (k.startsWith('nm|') || k.startsWith('vlab')) cache.delete(k); };
    if (document.fonts.ready) document.fonts.ready.then(refont);
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', refont);
  }
  for (let i = 0; i < 11; i++) spawnNode(i * .08); // ambient drift behind the start card
  BS.init({
    id: 'golden-thread',
    tagline: 'Connected data is context. Your agent is only as good as the fragments it can connect.',
    tutorial,
    onStart: start,
    score: () => score,
  });
  layoutBottom(); // the shell's strip exists now
  window.addEventListener('load', layoutBottom);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
