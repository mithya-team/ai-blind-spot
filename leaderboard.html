<style>
  /* Leaderboard: one table for everyone. Each game column shows points out of 1,000 (they add up to the total)
     and the player's best score underneath. Tap a game's heading to rank by that game and see its themed stats.
     Sizes are in --u: 1px on phones; on wide screens 1/1440 of the window width, so the page fills a laptop,
     a 4K monitor or a TV the same way. ?screen is the TV: no controls, as many rows as fit, refreshes every 4 s. */
  :root {
    --ink: #070a13; --fg: #eef1f8; --dim: rgba(238,241,248,.64); --faint: rgba(238,241,248,.42);
    --line: rgba(255,255,255,.11); --glass: rgba(255,255,255,.055); --gold: #f1d48a;
    --u: 1px; color-scheme: dark;
  }
  @media (min-width: 1100px) { :root { --u: calc(100vw / 1440); } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { background: var(--ink); }
  body { min-height: 100vh; color: var(--fg); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--ink); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
  .sky { position: absolute; inset: 0 0 auto 0; height: calc(560 * var(--u)); overflow: hidden; pointer-events: none; }
  .sky::before { content: ""; position: absolute; width: calc(700 * var(--u)); height: calc(700 * var(--u)); right: calc(-260 * var(--u)); top: calc(-380 * var(--u)); border-radius: 50%; background: radial-gradient(closest-side, transparent 55%, rgba(143,176,255,.3) 58%, rgba(143,176,255,.1) 68%, transparent 100%); }
  .sky::after { content: ""; position: absolute; inset: 0; background: radial-gradient(calc(560 * var(--u)) calc(380 * var(--u)) at 18% 0%, rgba(54,78,160,.42), transparent 70%), linear-gradient(180deg, transparent 60%, var(--ink)); }

  .wrap { position: relative; max-width: 560px; margin: 0 auto; padding: max(22px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 44px max(16px, env(safe-area-inset-left)); }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 18px; }
  .top > #logos { flex: none; padding-right: 14px; border-right: 1px solid var(--line); }
  .top .back { margin-left: auto; }
  .bs-logos { display: inline-flex; gap: calc(7 * var(--u)); vertical-align: middle; }
  .bs-lg { width: calc(32 * var(--u)); height: calc(32 * var(--u)); border-radius: 23%; overflow: hidden; display: block; box-shadow: 0 0 0 1px rgba(255,255,255,.16), 0 6px 14px -6px rgba(0,0,0,.7); }
  .bs-ot img { display: block; width: 108%; height: 108%; margin: -4%; }
  .back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--fg); text-decoration: none; padding: 9px 13px 9px 10px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); }
  .back svg { width: 14px; height: 14px; }
  h1 { font-weight: 700; font-size: 24px; letter-spacing: -.03em; line-height: 1; }
  h1 small { display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #8fb0ff; margin: 0 0 5px 1px; }
  .meta { display: flex; align-items: center; gap: 10px; flex: 1 0 100%; order: 5; }
  .cnt { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .live { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px 5px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; background: rgba(94,224,160,.12); color: #8ff0c0; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #5ee0a0; animation: ping 2s infinite; }
  .live.off { background: rgba(255,196,107,.12); color: #ffc46b; } .live.off i { background: #ffc46b; animation: none; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(94,224,160,.6); } 70%, 100% { box-shadow: 0 0 0 8px rgba(94,224,160,0); } }

  /* ---- Prizes ---- */
  .prizes { margin: 0 0 16px; padding: 16px 16px 8px; border-radius: 22px; background: linear-gradient(160deg, rgba(241,212,138,.12), rgba(255,255,255,.04) 55%); box-shadow: inset 0 0 0 1px rgba(241,212,138,.22); }
  .prizes h2 { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin: 0 2px 10px; }
  .prizes h2 svg { width: 15px; height: 15px; }
  .prize { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 8px 0; }
  .prize:has(.two) { grid-template-columns: 108px 1fr; }
  .prize + .prize { border-top: 1px solid var(--line); }
  .pv { position: relative; width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center; background: rgba(255,255,255,.07); color: #f6dc98; }
  .pv svg { width: 62%; height: 62%; }
  .pv.photo { background: radial-gradient(circle at 50% 38%, #fff, #dfe4ee 75%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
  .pv.photo img { position: absolute; inset: 8%; width: 84%; height: 84%; object-fit: contain; filter: drop-shadow(0 3px 4px rgba(10,16,32,.25)); }
  .pv.two { width: 108px; display: flex; align-items: center; justify-content: center; gap: 3px; padding: 0 6px; }
  .pv.two img { position: static; width: auto; min-width: 0; flex: 1 1 0; height: 78%; }
  .pv.two i { flex: none; font-style: normal; font-size: 8px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #6b7280; }
  .md { position: absolute; left: -5px; top: -5px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; box-shadow: 0 0 0 2px var(--ink); }
  .m1 { background: linear-gradient(150deg, #fff3c9, #e2b64d 55%, #b88422); color: #2a1c02; }
  .m2 { background: linear-gradient(150deg, #fff, #c3cbd9 55%, #8b95a8); color: #1a2030; }
  .m3 { background: linear-gradient(150deg, #ffd9b8, #cf8a52 55%, #96592a); color: #2a1503; }
  .prize.all .pv { color: #a9c1ff; }
  .pt small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .pt b { display: block; font-size: 15px; font-weight: 600; line-height: 1.3; margin-top: 2px; }
  .pt em { display: block; font-style: normal; font-size: 12.5px; color: var(--dim); margin-top: 3px; }
  .pt em i { font-style: normal; color: var(--gold); font-weight: 600; }
  .scan { display: none; }

  /* ---- Sorting (phones: a row of chips; wide screens: the column headings) ---- */
  .sort { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 12px; padding: 0 16px; }
  .sort::-webkit-scrollbar { display: none; }
  .sort button { flex: none; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--dim); padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--glass); cursor: pointer; }
  .sort button i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--c); }
  .sort button.on { color: #0b1020; background: var(--c, #eef1f8); border-color: transparent; }
  .sort button.on i { background: #0b1020; opacity: .5; }

  /* ---- Rows: phones get cards ---- */
  .thead { display: none; }
  ol { list-style: none; display: grid; gap: 8px; }
  li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; grid-template-areas: "pos who tot" "stats stats stats" "games games games"; column-gap: 12px; row-gap: 10px; align-items: center; padding: 13px 14px 12px 12px; border-radius: 18px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); }
  .in li { animation: rise .55s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 35ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .pos { grid-area: pos; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--dim); background: rgba(255,255,255,.05); }
  li.p1 .pos { background: linear-gradient(150deg, #fff3c9, #e2b64d 55%, #b88422); color: #2a1c02; box-shadow: 0 0 0 3px rgba(226,182,77,.2); }
  li.p2 .pos { background: linear-gradient(150deg, #fff, #c3cbd9 55%, #8b95a8); color: #1a2030; }
  li.p3 .pos { background: linear-gradient(150deg, #ffd9b8, #cf8a52 55%, #96592a); color: #2a1503; }
  li.p1 { background: linear-gradient(120deg, rgba(255,255,255,.12), rgba(255,255,255,.045)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
  .who { grid-area: who; min-width: 0; }
  .who b { display: flex; align-items: center; min-width: 0; font-size: 16px; font-weight: 600; white-space: nowrap; }
  .who b .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .who b .rung { flex: none; }
  .rung.own { display: none; }
  .who small { display: block; font-size: 12.5px; color: var(--dim); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* AI Ladder title beside the company */
  .rung { font-style: normal; display: inline-block; margin-left: .6em; padding: .16em .55em .18em; border-radius: .5em; font-size: .62em; font-weight: 700; line-height: 1.25; letter-spacing: .01em; }
  .rung.r4 { background: rgba(241,212,138,.16); color: #f6dc98; }
  .rung.r3 { background: rgba(79,163,255,.16); color: #9cc8ff; }
  .rung.r2 { background: rgba(139,92,246,.18); color: #c9b6ff; }
  .rung.r1 { background: rgba(255,255,255,.08); color: var(--dim); }
  .chips { grid-area: stats; display: flex; flex-wrap: wrap; gap: 4px; margin-top: -2px; }
  .chips i { font-style: normal; font-size: 11px; font-weight: 700; color: var(--c); padding: 5px 2px; }
  .chips span { font-size: 11.5px; line-height: 1; padding: 5px 8px; border-radius: 8px; background: rgba(255,255,255,.07); color: var(--dim); white-space: nowrap; }
  .tot { grid-area: tot; text-align: right; font-size: 22px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tot small { display: block; font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-top: 1px; }
  li.p1 .tot { color: var(--gold); font-size: 25px; }
  .games { grid-area: games; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; }
  .g { position: relative; padding: 6px 4px 6px 7px; border-radius: 9px; background: rgba(255,255,255,.05); min-width: 0; }
  .g .lbl { display: block; font-size: 9.5px; font-weight: 700; color: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g b { display: block; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .g small { display: none; }
  .g.none b { color: var(--faint); font-weight: 500; }
  .g.lead { background: color-mix(in srgb, var(--c) 18%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 55%, transparent); }
  .g .crown { position: absolute; right: 4px; top: 4px; width: 11px; height: 11px; color: var(--c); }
  .g.sorted { box-shadow: inset 0 0 0 1.5px var(--c); }
  .empty { padding: 34px 20px; text-align: center; border-radius: 20px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); color: var(--dim); font-size: 14.5px; line-height: 1.5; }
  .note { font-size: 12px; color: var(--faint); text-align: center; margin-top: 20px; line-height: 1.6; }

  /* ---- Wide screens and TVs: a real table, prizes and the QR code on the right; everything scales with --u ---- */
  @media (min-width: 1100px) {
    .wrap { max-width: none; padding: calc(36 * var(--u)) calc(56 * var(--u)) calc(44 * var(--u)); display: grid; grid-template-columns: minmax(0, 1fr) calc(360 * var(--u)); grid-template-areas: "top top" "main side"; column-gap: calc(32 * var(--u)); align-items: start; }
    .top { grid-area: top; flex-wrap: nowrap; gap: calc(18 * var(--u)); margin-bottom: calc(28 * var(--u)); }
    .top > #logos { padding-right: calc(18 * var(--u)); }
    /* One line, one size: "The AI Blind Spot" in blue, "Leaderboard" in white. */
    h1 { display: flex; align-items: baseline; gap: .28em; font-size: calc(30 * var(--u)); white-space: nowrap; }
    h1 small { display: inline; font-size: inherit; font-weight: 700; letter-spacing: inherit; text-transform: none; margin: 0; }
    .meta { flex: none; order: 0; margin-left: auto; gap: calc(12 * var(--u)); }
    .back { font-size: calc(13 * var(--u)); padding: calc(9 * var(--u)) calc(14 * var(--u)) calc(9 * var(--u)) calc(11 * var(--u)); }
    .back svg { width: calc(14 * var(--u)); height: calc(14 * var(--u)); }
    main { grid-area: main; min-width: 0; }
    .side { grid-area: side; position: sticky; top: calc(20 * var(--u)); }
    .cnt { font-size: calc(12 * var(--u)); }
    .live { font-size: calc(11 * var(--u)); padding: calc(5 * var(--u)) calc(11 * var(--u)) calc(5 * var(--u)) calc(9 * var(--u)); gap: calc(7 * var(--u)); }
    .live i { width: calc(8 * var(--u)); height: calc(8 * var(--u)); }
    .sort { display: none; }
    .prizes { margin: 0; padding: calc(22 * var(--u)) calc(22 * var(--u)) calc(10 * var(--u)); border-radius: calc(24 * var(--u)); }
    .prizes h2 { font-size: calc(11.5 * var(--u)); gap: calc(8 * var(--u)); margin: 0 calc(2 * var(--u)) calc(10 * var(--u)); }
    .prizes h2 svg { width: calc(15 * var(--u)); height: calc(15 * var(--u)); }
    .prize { grid-template-columns: calc(78 * var(--u)) 1fr; gap: calc(14 * var(--u)); padding: calc(10 * var(--u)) 0; }
    .prize:has(.two) { grid-template-columns: calc(132 * var(--u)) 1fr; }
    .pv { width: calc(78 * var(--u)); height: calc(78 * var(--u)); border-radius: calc(16 * var(--u)); }
    .pv.two { width: calc(132 * var(--u)); gap: calc(3 * var(--u)); padding: 0 calc(7 * var(--u)); }
    .pv.two i { font-size: calc(8.5 * var(--u)); }
    .md { width: calc(22 * var(--u)); height: calc(22 * var(--u)); font-size: calc(12 * var(--u)); left: calc(-6 * var(--u)); top: calc(-6 * var(--u)); }
    .pt small { font-size: calc(10.5 * var(--u)); } .pt b { font-size: calc(16 * var(--u)); margin-top: calc(2 * var(--u)); } .pt em { font-size: calc(13 * var(--u)); margin-top: calc(3 * var(--u)); }
    .scan { display: grid; grid-template-columns: calc(112 * var(--u)) 1fr; gap: calc(16 * var(--u)); align-items: center; margin-top: calc(14 * var(--u)); padding: calc(14 * var(--u)); border-radius: calc(24 * var(--u)); background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); }
    .scan img { width: calc(112 * var(--u)); height: calc(112 * var(--u)); padding: calc(8 * var(--u)); border-radius: calc(14 * var(--u)); background: #fff; }
    .scan b { display: block; font-size: calc(19 * var(--u)); font-weight: 700; }
    .scan span { display: block; font-size: calc(13 * var(--u)); color: var(--dim); margin-top: calc(4 * var(--u)); line-height: 1.4; }

    .thead, li { grid-template-columns: calc(52 * var(--u)) minmax(0, 1fr) repeat(var(--n), calc(104 * var(--u))) calc(116 * var(--u)); grid-template-areas: none; column-gap: calc(8 * var(--u)); }
    /* Headings share the rows' padding and columns, and each label starts where its cell's text starts. */
    .thead { display: grid; align-items: center; padding: 0 calc(18 * var(--u)) calc(8 * var(--u)) calc(14 * var(--u)); }
    .thead span, .thead button { display: block; font: inherit; font-size: calc(12 * var(--u)); font-weight: 700; line-height: calc(18 * var(--u)); padding: 0 0 calc(4 * var(--u)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thead span { color: var(--faint); }
    .thead span.hash { width: calc(40 * var(--u)); text-align: center; }
    .thead button { width: 100%; text-align: left; padding-left: calc(10 * var(--u)); padding-right: calc(4 * var(--u)); border-radius: calc(8 * var(--u)); border: 0; background: none; cursor: pointer; color: var(--c); }
    .thead button:hover { background: rgba(255,255,255,.06); }
    .thead button.on { background: color-mix(in srgb, var(--c) 18%, transparent); box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--c); }
    .thead button.tot { text-align: right; padding-left: 0; padding-right: 0; color: var(--fg); }
    .thead button.tot.on { background: none; box-shadow: none; }
    ol { gap: calc(7 * var(--u)); }
    li { padding: calc(10 * var(--u)) calc(18 * var(--u)) calc(10 * var(--u)) calc(14 * var(--u)); border-radius: calc(18 * var(--u)); row-gap: 0; min-height: calc(66 * var(--u)); }
    .pos, .who, .tot { grid-area: auto; }
    .games { display: contents; }
    .pos { width: calc(40 * var(--u)); height: calc(40 * var(--u)); font-size: calc(16 * var(--u)); }
    .who b { font-size: calc(18 * var(--u)); } .who small { font-size: calc(13 * var(--u)); margin-top: calc(1 * var(--u)); }
    /* wide screens: the AI Ladder title gets its own line under the company, so names never get squeezed */
    .rung.in { display: none; } .rung.own { display: inline-block; margin: calc(5 * var(--u)) 0 0; font-size: calc(11 * var(--u)); }
    /* ranked by one game: that game's themed stats on a line of their own under the row */
    .chips { grid-area: auto; grid-column: 2 / -1; grid-row: 2; display: flex; flex-wrap: wrap; gap: calc(5 * var(--u)); margin: calc(8 * var(--u)) 0 calc(2 * var(--u)); }
    .chips i { font-size: calc(11.5 * var(--u)); padding: calc(5 * var(--u)) calc(4 * var(--u)) calc(5 * var(--u)) 0; }
    .chips span { font-size: calc(12 * var(--u)); padding: calc(5 * var(--u)) calc(9 * var(--u)); border-radius: calc(8 * var(--u)); }
    .g { padding: calc(7 * var(--u)) calc(10 * var(--u)); border-radius: calc(10 * var(--u)); background: none; }

    .g.sorted:not(.lead) { box-shadow: inset 0 0 0 calc(1.5 * var(--u)) color-mix(in srgb, var(--c) 60%, transparent); }
    .tot { font-size: calc(26 * var(--u)); } li.p1 .tot { font-size: calc(30 * var(--u)); }
    .tot small { display: none; }
    .empty { font-size: calc(15 * var(--u)); padding: calc(40 * var(--u)); border-radius: calc(20 * var(--u)); }
    .note { font-size: calc(12 * var(--u)); margin-top: calc(22 * var(--u)); }
  }

  /* ---- The TV: no controls, fixed height, as many rows as fit ---- */
  .screen body { overflow: hidden; }
  .screen .wrap { height: 100vh; grid-template-rows: auto 1fr; padding-bottom: calc(28 * var(--u)); }
  .screen main { display: flex; flex-direction: column; min-height: 0; height: 100%; }
  .screen ol { flex: 1; min-height: 0; overflow: hidden; align-content: start; }
  .screen .back, .screen .note, .screen .sort { display: none !important; }
  .screen .thead button { cursor: default; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .in li, .live i { animation: none; } }
</style>

<body>
<div class="sky" aria-hidden="true"></div>
<div class="wrap">
  <div class="top"><span id="logos"></span><h1><small>The AI Blind Spot</small>Leaderboard</h1><div class="meta"><span class="cnt" id="cnt"></span><span class="live" id="live" hidden><i></i><span></span></span></div><a class="back" id="back" href="games.html" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>All games</a></div>
  <main>
    <section class="prizes m" id="prizesM" aria-label="Prizes"></section>
    <div class="sort" id="sort" role="tablist" aria-label="Rank by"></div>
    <div class="thead" id="thead"></div>
    <ol id="rows"></ol>
    <p class="note" id="note"></p>
  </main>
  <aside class="side">
    <section class="prizes" id="prizesD" aria-label="Prizes"></section>
    <div class="scan"><img src="icons/qr-play.svg" alt="QR code that opens the games"><div><b>Scan to play</b><span>Point your phone's camera at the code. Three quick games, three attempts each.</span></div></div>
  </aside>
</div>
<script src="shared/config.js?v=21"></script>
<script src="shared/common.js?v=21"></script>
<script>
  const LOOK = {
    'stack-up': { acc: '#8ff0c0', short: 'Stack Up' },
    'vital-signs': { acc: '#ffa3b6', short: 'Vitals' },
    'golden-thread': { acc: '#f1d48a', short: 'Thread' },
    'deep-dive': { acc: '#9eeaff', short: 'Dive' },
    'clear-cut': { acc: '#d9ccff', short: 'Clear Cut' },
  };
  const games = Object.keys(BS.GAMES), screen = BS.params.has('screen'), wideQ = matchMedia('(min-width: 1100px)');
  const rowsEl = document.getElementById('rows');
  document.documentElement.style.setProperty('--n', games.length);
  document.getElementById('logos').innerHTML = BS.LOGOS;
  if (screen) document.documentElement.classList.add('screen');
  // "All games" only for players on phones and tablets. Computers and the TV always show just the leaderboard
  // (the team gets to the games by typing "play").
  document.getElementById('back').hidden = screen || !BS.touch;
  // Prizes sit on the right on wide screens and above the table on phones; only one copy is shown.
  const syncPrizePlace = () => { document.getElementById('prizesM').hidden = wideQ.matches; document.getElementById('prizesD').hidden = !wideQ.matches; };
  wideQ.addEventListener('change', syncPrizePlace); syncPrizePlace();

  const by = () => { const h = location.hash.slice(1); return !screen && games.includes(h) ? h : 'total'; };
  const ICON = {
    glasses: '<path d="M2.5 10.5h7v3.2a3 3 0 0 1-3 3h-1a3 3 0 0 1-3-3zM14.5 10.5h7v3.2a3 3 0 0 1-3 3h-1a3 3 0 0 1-3-3zM9.5 11.5c1.6-1 3.4-1 5 0M2.5 10.5l1.8-3.5M21.5 10.5l-1.8-3.5"/>',
    band: '<rect x="7.5" y="7" width="9" height="10" rx="3"/><path d="M9 7V3.5h6V7M9 17v3.5h6V17M10.5 12h1.2l.8-1.6 1 3.2.8-1.6h.7"/>',
    bottle: '<path d="M9.5 2.5h5v2.5h-5zM9 5h6a1.5 1.5 0 0 1 1.5 1.5V20a1.5 1.5 0 0 1-1.5 1.5H9A1.5 1.5 0 0 1 7.5 20V6.5A1.5 1.5 0 0 1 9 5zM7.5 9.5h9"/>',
    socks: '<path d="M8 2.5h6v9.2l3.7 3.4a3 3 0 0 1-4.1 4.4l-4.7-4.4A3 3 0 0 1 8 13z"/><path d="M8 6h6"/>',
    gift: '<rect x="3.5" y="9" width="17" height="11.5" rx="1.5"/><path d="M3.5 13h17M12 9v11.5M12 9c-1.5-3.5-5.5-4-5.5-1.5S10 9 12 9zM12 9c1.5-3.5 5.5-4 5.5-1.5S14 9 12 9z"/>',
  };
  const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k] || ICON.gift}</svg>`;
  const CROWN = '<svg class="crown" viewBox="0 0 24 24" fill="currentColor" aria-label="Top score in this game"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>';

  function paintPrizes(all) {
    const list = BS.CFG.prizes || [];
    const html = list.length ? `<h2>${svg('gift')}Prizes</h2>` + list.map(p => {
      const holder = p.place > 0 ? all[p.place - 1] : null;
      const lead = p.place > 0 ? (holder ? `Now: <i>${BS.esc(holder.name)}</i> · ${BS.esc(holder.company)}` : 'Up for grabs') : '';
      const imgs = [].concat(p.img || []).filter(Boolean);
      const vis = imgs.length ? imgs.map(src => `<img src="${BS.esc(src)}" alt="">`).join(imgs.length > 1 ? '<i>or</i>' : '') : svg(p.icon);
      return `<div class="prize${p.place > 0 ? '' : ' all'}"><div class="pv${imgs.length ? ' photo' : ''}${imgs.length > 1 ? ' two' : ''}">${vis}${p.place > 0 ? `<span class="md m${p.place}">${p.place}</span>` : ''}</div>
        <div class="pt"><small>${BS.esc(p.label)}</small><b>${BS.esc(p.title)}</b>${lead ? `<em>${lead}</em>` : ''}</div></div>`;
    }).join('') : '';
    for (const id of ['prizesM', 'prizesD']) document.getElementById(id).innerHTML = html;
  }
  function paintLive() {
    const el = document.getElementById('live'), s = BS.sync;
    el.hidden = !s.remote || BS.demo;
    if (el.hidden) return;
    el.classList.toggle('off', s.state === 'offline');
    el.querySelector('span').textContent = s.state === 'offline' ? 'Reconnecting' : 'Live';
  }

  function render(animate) {
    const sort = by(), all = BS.overall();
    const boards = {}; for (const g of games) boards[g] = BS.board(g); // per game, best first; board rows carry the themed stats
    const stat = (g, key) => boards[g].find(r => r.key === key);
    let rows = all.map((r, i) => ({ ...r, rank: i + 1 }));
    if (sort !== 'total') { // rank by one game: its players first, in that game's order; everyone else after, unranked
      const order = new Map(boards[sort].map((r, i) => [r.key, i]));
      rows.sort((a, b) => (order.has(a.key) ? order.get(a.key) : 1e9) - (order.has(b.key) ? order.get(b.key) : 1e9) || b.score - a.score);
      rows = rows.map(r => ({ ...r, rank: order.has(r.key) ? order.get(r.key) + 1 : null }));
    }
    const leader = {}; for (const g of games) leader[g] = boards[g][0] && boards[g][0].key;
    const overallRank = new Map(all.map((r, i) => [r.key, i + 1])); // AI Ladder titles always follow the total

    document.getElementById('cnt').textContent = all.length ? BS.pl(all.length, 'player') : '';
    const sortBtns = [['total', 'Total', '#eef1f8'], ...games.map(g => [g, BS.GAMES[g].title, LOOK[g].acc])];
    document.getElementById('sort').innerHTML = sortBtns.map(([k, t, c]) => `<button type="button" role="tab" data-k="${k}" class="${k === sort ? 'on' : ''}" style="--c:${c}" aria-selected="${k === sort}">${k === 'total' ? '' : '<i></i>'}${t}</button>`).join('');
    document.getElementById('thead').innerHTML = `<span class="hash">#</span><span>Player</span>` +
      games.map(g => `<button type="button" data-k="${g}" class="${g === sort ? 'on' : ''}" style="--c:${LOOK[g].acc}" title="Rank by ${BS.GAMES[g].title}">${BS.GAMES[g].title}</button>`).join('') +
      `<button type="button" data-k="total" class="tot${sort === 'total' ? ' on' : ''}" title="Rank by total">Total</button>`;

    const limit = screen ? 30 : 100;
    rowsEl.classList.toggle('in', !!animate);
    rowsEl.innerHTML = rows.length ? rows.slice(0, limit).map((r, i) => {
      const st = sort !== 'total' ? stat(sort, r.key) : null;
      const cells = games.map(g => {
        const part = r.parts[g], lead = leader[g] === r.key;
        return `<span class="g${part ? '' : ' none'}${lead ? ' lead' : ''}${g === sort ? ' sorted' : ''}" style="--c:${LOOK[g].acc}"><span class="lbl">${LOOK[g].short}</span>${lead ? CROWN : ''}<b>${part ? BS.fmt(part.pts) : '–'}</b>${part ? `<small>best ${BS.fmt(part.raw)}</small>` : ''}</span>`;
      }).join('');
      const medal = r.rank && r.rank <= 3 ? ' p' + r.rank : '';
      return `<li class="${medal}" style="--i:${i}"><span class="pos">${r.rank || '–'}</span>
        ${(rg => `<span class="who"><b><span class="nm">${BS.esc(r.name)}</span>${rg ? `<i class="rung r${rg.n} in">${rg.name}</i>` : ''}</b><small>${BS.esc(r.company)}</small>${rg ? `<i class="rung r${rg.n} own">${rg.name}</i>` : ''}</span>`)(BS.rung(overallRank.get(r.key), all.length))}
        ${st ? `<span class="chips" style="--c:${LOOK[sort].acc}"><i>${BS.esc(BS.GAMES[sort].title)}</i>${BS.GAMES[sort].line(st.stats || {}).split(' · ').map(c => `<span>${BS.esc(c)}</span>`).join('')}</span>` : ''}
        <span class="games">${cells}</span>
        <span class="tot">${BS.fmt(r.score)}<small>total</small></span></li>`;
    }).join('') : `<div class="empty">No scores yet.${screen ? ' Scan the code to be the first.' : ''}</div>`;

    document.getElementById('note').innerHTML = (sort === 'total' ? 'Each game is worth up to 1,000 points: the top score in a game gets 1,000 and everyone else is scaled against it. The prizes go by the total.' : `Ranked by ${BS.esc(BS.GAMES[sort].title)}. Tap Total to go back.`) +
      ' Small figures are each player\'s best score. On a tie, whoever got there first ranks higher.' +
      ' Titles follow OpenText\'s AI Ladder: the top quarter are Agentic Enterprise, then Composable AI, In-App Agents and In-App AI.' +
      (BS.demo ? '<br>Showing invented sample players (?demo).' : BS.sync.remote ? '' : '<br>Prototype: this shows scores saved on this device.');
    paintPrizes(all); paintLive();
    if (screen) fitRows();
  }
  // TV: show only whole rows that fit the screen.
  function fitRows() {
    const box = rowsEl.getBoundingClientRect().bottom;
    [...rowsEl.children].forEach(li => { li.hidden = false; });
    for (const li of [...rowsEl.children]) if (li.getBoundingClientRect().bottom > box + 1) li.hidden = true;
  }
  const pick = e => { const b = e.target.closest('button[data-k]'); if (!b || screen) return; const k = b.dataset.k; history.replaceState(null, '', k === 'total' ? location.pathname + location.search : '#' + k); render(true); };
  document.getElementById('sort').addEventListener('click', pick);
  document.getElementById('thead').addEventListener('click', pick);
  window.addEventListener('hashchange', () => render(true));
  window.addEventListener('resize', () => { if (screen) fitRows(); });
  window.addEventListener('bs:sync', () => render(false));
  render(true);
  if (BS.sync.remote && !BS.demo) BS.sync.every(screen ? 4000 : 8000);
  else if (screen && !BS.demo) setInterval(() => render(false), 4000);
</script>
</body>
</html>
