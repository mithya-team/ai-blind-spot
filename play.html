<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blind Spot Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Wide-screen stage: the game runs in a phone-shaped frame in the middle so it plays exactly as on a phone.
     Left: what the game is and your rounds. Right: that game's live leaderboard. */
  :root {
    --ink: #070a13; --fg: #eef1f8; --dim: rgba(238,241,248,.64); --faint: rgba(238,241,248,.42);
    --line: rgba(255,255,255,.11); --glass: rgba(255,255,255,.06); --acc: #f1d48a; --acc-ink: #1a1405; --wash: rgba(54,78,160,.42);
    --font-ui: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-head: Inter, -apple-system, sans-serif; --font-game: var(--font-head);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; min-height: 100vh; color: var(--fg); font-family: var(--font-ui); background: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .sky { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(900px 620px at 50% 46%, var(--wash), transparent 70%); }
  .top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px clamp(16px, 3vw, 40px) 14px; }
  .bs-logos { display: inline-flex; gap: 7px; vertical-align: middle; }
  .bs-lg { width: 32px; height: 32px; border-radius: 23%; overflow: hidden; display: block; box-shadow: 0 0 0 1px rgba(255,255,255,.16), 0 6px 14px -6px rgba(0,0,0,.7); }
  .bs-ot img { display: block; width: 108%; height: 108%; margin: -4%; }
  .top nav { display: flex; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--fg); text-decoration: none; padding: 9px 13px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); }
  .pill svg { width: 14px; height: 14px; }

  .layout { position: relative; flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: clamp(24px, 4vw, 64px); align-items: center; width: 100%; max-width: 1380px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 40px) 22px; }
  .phone {
    height: clamp(520px, calc(100vh - 106px), 860px); width: clamp(340px, calc((100vh - 106px) * .474), 408px);
    border-radius: 38px; overflow: hidden; background: #000;
    box-shadow: 0 0 0 1px rgba(255,255,255,.16), 0 0 0 9px rgba(255,255,255,.035), 0 0 0 10px rgba(255,255,255,.07), 0 60px 110px -40px #000;
  }
  .phone iframe { display: block; width: 100%; height: 100%; border: 0; }

  .info { justify-self: end; width: 100%; max-width: 360px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #8fb0ff; }
  .info h1 { font-family: var(--font-game); font-weight: var(--game-weight, 800); letter-spacing: var(--game-track, -.03em); font-size: clamp(44px, 4.4vw, 62px); line-height: .98; color: var(--acc); margin: 12px 0 14px; text-wrap: balance; }
  .blurb { font-size: 16px; line-height: 1.5; color: var(--dim); text-wrap: pretty; }
  .box { margin-top: 22px; padding: 14px 16px; border-radius: 18px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); }
  .box h2 { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
  .box p { font-size: 14px; line-height: 1.5; color: var(--fg); }
  .pips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pip i { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-bottom: 7px; }
  .pip b { display: block; font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--faint); }
  .pip small { display: block; font-size: 14px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; color: var(--faint); }
  .pip.done i { background: var(--acc); } .pip.done b { color: var(--dim); } .pip.done small { color: var(--fg); }
  .pip.cur b { color: var(--dim); } .pip.cur small { color: var(--acc); } .pip.cur i { background: linear-gradient(90deg, var(--acc) 40%, var(--line) 40%); }
  .rule { font-size: 12.5px; line-height: 1.5; color: var(--faint); margin-top: 10px; }
  .who { font-size: 13px; color: var(--faint); margin-top: 18px; }
  .who b { color: var(--dim); font-weight: 600; }

  .board { justify-self: start; width: 100%; max-width: 360px; }
  .bh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 0 2px 10px; }
  .bh h2 { font-family: var(--font-head); font-weight: 700; font-size: 22px; letter-spacing: -.02em; }
  .bh span { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  ol { list-style: none; display: grid; gap: 6px; }
  li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px 10px 10px; border-radius: 16px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); }
  .pos { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13.5px; color: var(--dim); background: rgba(255,255,255,.05); font-variant-numeric: tabular-nums; }
  li.p1 .pos { background: linear-gradient(150deg, #fff3c9, #e2b64d 55%, #b88422); color: #2a1c02; }
  li.p2 .pos { background: linear-gradient(150deg, #fff, #c3cbd9 55%, #8b95a8); color: #1a2030; }
  li.p3 .pos { background: linear-gradient(150deg, #ffd9b8, #cf8a52 55%, #96592a); color: #2a1503; }
  li.me { box-shadow: inset 0 0 0 1.5px var(--acc); }
  li.gap { display: block; background: none; box-shadow: none; text-align: center; padding: 0; color: var(--faint); }
  .nm { min-width: 0; }
  .nm b { display: block; font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nm small { display: block; font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sc { font-family: var(--font-head); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  li.p1 .sc { color: var(--acc); }
  .empty { padding: 22px 16px; border-radius: 16px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; line-height: 1.5; color: var(--dim); text-align: center; }
  .ovr { margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; color: var(--dim); display: flex; justify-content: space-between; gap: 10px; }
  .ovr b { color: var(--fg); font-weight: 600; }
  .more { display: inline-block; margin: 14px 2px 0; font-size: 13.5px; font-weight: 600; color: var(--acc); text-decoration: none; }

  @media (max-width: 1039px) {
    .info, .board { display: none; }
    .layout { grid-template-columns: 1fr; justify-items: center; }
  }
  @media (max-height: 640px) { .top { padding-top: 10px; padding-bottom: 8px; } }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<header class="top">
  <span id="logos"></span>
  <nav>
    <a class="pill" href="games.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>All games</a>
    <a class="pill" href="leaderboard.html">Leaderboard</a>
  </nav>
</header>
<main class="layout">
  <section class="info">
    <p class="eyebrow">The AI Blind Spot</p>
    <h1 id="gt"></h1>
    <p class="blurb" id="blurb"></p>
    <div class="box"><h2>On a computer</h2><p id="ctl"></p></div>
    <div class="box"><h2>Your rounds</h2><div class="pips" id="pips"></div><p class="rule">One practice round, then three attempts. Your best attempt counts.</p></div>
    <p class="who" id="who"></p>
  </section>
  <div class="phone"><iframe id="frame" title="Game" allow="autoplay"></iframe></div>
  <section class="board">
    <div class="bh"><h2>Leaderboard</h2><span id="rank"></span></div>
    <ol id="rows"></ol>
    <div class="ovr" id="ovr"></div>
    <a class="more" id="more" href="leaderboard.html">Full leaderboard →</a>
  </section>
</main>
<script src="shared/common.js?v=13"></script>
<script>
  const LOOK = {
    'golden-thread': { acc: '#f1d48a', ink: '#1a1405', wash: 'rgba(48,70,160,.5)', font: 'Inter, sans-serif', weight: 700, track: '-.03em',
      ctl: 'Click and hold on a fragment, drag through others to link them, then release to bank the thread.' },
    'deep-dive': { acc: '#9eeaff', ink: '#04202c', wash: 'rgba(22,96,132,.5)', font: 'Inter, sans-serif', weight: 700, track: '-.03em',
      ctl: 'Click and drag left or right to steer. The arrow keys work too.' },
    'clear-cut': { acc: '#d9ccff', ink: '#1d1640', wash: 'rgba(112,92,196,.42)', font: 'Inter, sans-serif', weight: 700, track: '-.03em',
      ctl: 'Click and drag across a pane to cut it. Click a gold seal to approve it, and never drag through one.' },
  };
  const q = BS.params, id = q.get('g'), g = BS.GAMES[id], L = LOOK[id];
  if (!g) location.replace('games.html');
  else if (!BS.hasPlayer()) location.replace('index.html?next=' + encodeURIComponent(g.href));
  else {
    const st = document.documentElement.style, $ = s => document.getElementById(s);
    st.setProperty('--acc', L.acc); st.setProperty('--acc-ink', L.ink); st.setProperty('--wash', L.wash);
    st.setProperty('--font-game', L.font); st.setProperty('--game-weight', L.weight); st.setProperty('--game-track', L.track);
    document.title = g.title + ' · Blind Spot';
    $('logos').innerHTML = BS.LOGOS;
    $('gt').textContent = g.title; $('blurb').textContent = g.blurb; $('ctl').textContent = L.ctl;
    $('more').href = 'leaderboard.html#' + id;
    const p = BS.player(), me = (p.name + '|' + p.company).toLowerCase();
    $('who').innerHTML = `Playing as <b>${BS.esc(p.name)} · ${BS.esc(p.company)}</b>`;

    function render() {
      const pr = BS.progress(id), mode = BS.nextMode(id);
      const cell = (t, run, cur) => `<div class="pip${run ? ' done' : ''}${cur ? ' cur' : ''}"><i></i><b>${t}</b><small>${run ? BS.fmt(run.score) : cur ? 'Next' : '–'}</small></div>`;
      $('pips').innerHTML = cell('Practice', pr.practice, mode === 'practice')
        + [0, 1, 2].map(i => cell('Attempt ' + (i + 1), pr.runs[i], mode === 'ranked' && i === pr.runs.length)).join('');
      const board = BS.board(id), rank = board.findIndex(r => r.key === me) + 1, TOP = 7;
      const li = (r, pos) => `<li class="${r.key === me ? 'me' : ''} ${pos <= 3 ? 'p' + pos : ''}"><span class="pos">${pos}</span><span class="nm"><b>${BS.esc(r.name)}</b><small>${BS.esc(r.company)}${r.source === 'practice' ? ' · practice' : ''}</small></span><span class="sc">${BS.fmt(r.score)}</span></li>`;
      let html = board.slice(0, TOP).map((r, i) => li(r, i + 1)).join('');
      if (rank > TOP) html += '<li class="gap">···</li>' + li(board[rank - 1], rank);
      $('rows').innerHTML = html || '<div class="empty">No scores yet. Yours will be the first.</div>';
      $('rank').textContent = rank ? `You're #${rank} of ${board.length}` : '';
      const all = BS.overall(), orank = all.findIndex(r => r.key === me) + 1;
      $('ovr').innerHTML = orank ? `<span>Overall, across all three games</span><b>#${orank} of ${all.length} · ${BS.fmt(all[orank - 1].score)}</b>` : '<span>Overall, across all three games</span><b>Not ranked yet</b>';
    }
    render();

    // Load the game inside the phone frame, passing test options through.
    const fq = new URLSearchParams(location.search); fq.delete('g'); fq.set('framed', '1');
    const frame = $('frame');
    let ready = false;
    window.addEventListener('message', e => {
      if (e.source !== frame.contentWindow || !e.data || !e.data.bs) return;
      if (e.data.type === 'ready') ready = true;
      render();
    });
    window.addEventListener('storage', render);
    frame.addEventListener('load', () => { try { frame.contentWindow.focus(); } catch (e) {} });
    frame.src = g.href + '?' + fq;
    // If the frame cannot load here, fall back to the plain full-window game.
    setTimeout(() => { if (!ready) location.replace(g.href + '?nostage=1'); }, 6000);
  }
</script>
</body>
</html>
