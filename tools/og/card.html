<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: #fff; font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(700px 520px at 18% 30%, var(--glow), transparent 70%), var(--bg); }
  .shot { position: absolute; right: 0; top: 0; width: 600px; height: 630px; background-size: cover; background-position: center;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 34%), linear-gradient(180deg, #000 82%, transparent);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  .art { position: absolute; right: 0; top: 0; width: 600px; height: 630px; }
  .left { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 610px; display: flex; flex-direction: column; }
  .bs-full { display: inline-flex; align-items: center; gap: 20px; --lh: 24px; }
  .bs-full > * { box-sizing: content-box; height: var(--lh); flex: none; }
  .bs-full > * + * { padding-left: 20px; border-left: 1px solid rgba(255,255,255,.22); }
  .lf.ot { display: inline-flex; align-items: center; gap: calc(var(--lh) * .34); }
  .lf.ot img { display: block; height: 100%; width: auto; }
  .lf.ot img:first-child { clip-path: inset(3% round 22%); transform: scale(1.06); }
  .lf.aws { height: calc(var(--lh) * 1.12); }
  .lf.cap { height: calc(var(--lh) * 1.16); }
  .kick { margin-top: auto; font-size: 20px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--acc); }
  h1 { font-size: 100px; font-weight: 700; line-height: .95; letter-spacing: -.045em; margin: 14px 0 22px; color: var(--title); }
  p { font-size: 30px; line-height: 1.3; color: rgba(255,255,255,.82); max-width: 20ch; letter-spacing: -.01em; }
  .foot { margin-top: 30px; font-size: 19px; font-weight: 600; color: rgba(255,255,255,.55); letter-spacing: .01em; }
  .foot b { color: var(--acc); font-weight: 700; }
</style></head>
<body><div class="stage" id="st">
  <div class="shot" id="shot"></div>
  <div class="left">
    <div id="logos"></div>
    <div class="kick">The AI Blind Spot</div>
    <h1 id="t"></h1>
    <p id="d"></p>
    <div class="foot" id="f"></div>
  </div>
</div>
<script src="http://127.0.0.1:8791/shared/common.js?v=og"></script>
<script>
  const q = new URLSearchParams(location.search), s = document.documentElement.style;
  ['bg', 'glow', 'acc', 'title'].forEach(k => s.setProperty('--' + k, q.get(k)));
  document.getElementById('logos').innerHTML = BS.LOGOS_FULL.replace(/shared\//g, 'http://127.0.0.1:8791/shared/');
  document.getElementById('t').innerHTML = q.get('t');
  document.getElementById('d').textContent = q.get('d');
  document.getElementById('f').innerHTML = q.get('f') || 'Play on your phone · <b>Beat the room</b>';
  if (q.get('img')) document.getElementById('shot').style.backgroundImage = `url("${q.get('img')}")`;
  if (q.get('art')) { const a = document.getElementById('shot'); a.outerHTML = `<div class="art">${decodeURIComponent(q.get('art'))}</div>`; }
</script>
</body></html>
